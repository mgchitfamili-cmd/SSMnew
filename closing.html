<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>POS – နေ့စဉ် ငွေစာရင်းပိတ်</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #7c3aed;
    --accent-soft: #ede9fe;
    --ink: #1f2937;
    --muted: #9ca3af;
    --line: #e5e7eb;
    --surface: #ffffff;
    --page: #f3f4f8;
    --drawer-w: min(320px, 86vw);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #a78bfa;
      --accent-soft: #2e2457;
      --ink: #e5e7eb;
      --muted: #6b7280;
      --line: #2b2f3a;
      --surface: #171a22;
      --page: #0f1117;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans Myanmar", "Padauk", system-ui, sans-serif;
    background: var(--page);
    color: var(--ink);
    line-height: 1.6;
    overflow: hidden;
  }

  /* ---------- Top bar + main ---------- */
  .app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: calc(var(--safe-top) + 8px) 12px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 12px;
    background: transparent; color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--accent-soft); }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  main { flex: 1; overflow: auto; padding: 20px; }
  main p { color: var(--muted); margin: 4px 0 0; }

  /* ---------- Drawer ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(15, 17, 23, .5);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 40;
  }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: var(--drawer-w);
    background: var(--surface);
    transform: translateX(-100%);
    transition: transform .28s cubic-bezier(.3, .8, .3, 1);
    z-index: 50;
    overflow-y: auto; overscroll-behavior: contain;
    padding: calc(var(--safe-top) + 12px) 0 calc(var(--safe-bottom) + 24px);
    box-shadow: 4px 0 24px rgba(0, 0, 0, .15);
  }
  body.menu-open .drawer { transform: none; }
  body.menu-open .backdrop { opacity: 1; pointer-events: auto; }
  body.dragging .drawer, body.dragging .backdrop { transition: none; }

  .group-title {
    margin: 18px 20px 6px; font-size: 14px; font-weight: 700; color: var(--ink);
  }
  .group-title:first-child { margin-top: 8px; }

  .item {
    display: flex; align-items: center; gap: 16px;
    width: calc(100% - 24px); margin: 0 12px;
    min-height: 48px; padding: 0 12px;
    border: 0; border-radius: 12px; background: transparent;
    font: inherit; font-size: 16px; color: var(--ink); text-align: left;
    cursor: pointer;
  }
  .item:active { background: var(--accent-soft); }
  .item svg { flex: none; }
  .item .label { flex: 1; }
  .item .chev { transition: transform .2s; color: var(--ink); }
  .item.open .chev { transform: rotate(180deg); }
  .item.active { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
  .item.disabled { color: var(--muted); }
  .item.disabled .chev { color: var(--muted); }

  .sub { display: none; margin: 0 12px 4px 56px; border-left: 2px solid var(--line); }
  .sub.open { display: block; }
  .sub .item { width: 100%; margin: 0; min-height: 42px; font-size: 15px; padding-left: 16px; }

  /* Wide screens (iPad landscape): menu stays visible */
  @media (min-width: 1024px) {
    .drawer { transform: none; box-shadow: none; border-right: 1px solid var(--line); }
    .backdrop { display: none; }
    .app { margin-left: var(--drawer-w); }
    #menuBtn { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .backdrop, .item .chev { transition: none; }
  }

  /* =====================================================
     ကုန်ပစ္စည်း (Products) page
     ===================================================== */
  :root {
    --on-accent: #ffffff;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --on-accent: #1b1033;
      --danger: #f87171;
      --danger-soft: #3b1c1c;
      --warn: #fbbf24;
    }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pg { max-width: 1240px; margin: 0 auto; }

  /* Buttons */
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap;
  }
  .btn:active { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:active { filter: brightness(.92); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .btn.small { min-height: 40px; padding: 0 14px; }
  @media (hover: hover) {
    .btn:hover { border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.06); }
  }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700;
    display: inline-grid; place-items: center;
  }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .search {
    flex: 1 1 100%; display: flex; align-items: center; gap: 10px;
    min-height: 46px; padding: 0 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  }
  .search:focus-within { border-color: var(--accent); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 15px; color: var(--ink); height: 44px;
  }
  .toolbar .btn { flex: 1 1 0; }
  @media (min-width: 700px) {
    .search { flex: 1 1 320px; }
    .toolbar .btn { flex: 0 0 auto; }
  }
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
    margin-top: 12px; padding: 14px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .filters[hidden] { display: none; }
  .filters .reset { align-self: end; }
  .count { margin: 14px 2px 10px; font-size: 14px; color: var(--muted); }

  /* Form controls */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .flabel { font-size: 14px; font-weight: 500; }
  .field .req { color: var(--danger); margin-left: 3px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea, .addrow input {
    width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px;
  }
  .field textarea { min-height: 96px; padding: 10px 14px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus, .addrow input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field .help { font-size: 13px; color: var(--muted); }
  .field .msg { font-size: 13px; color: var(--danger); display: none; }
  .field.err input, .field.err select { border-color: var(--danger); }
  .field.err .msg { display: block; }
  .linkbtn {
    align-self: flex-start; border: 0; background: none; padding: 4px 0; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: underline;
  }
  .addrow { display: flex; gap: 8px; }
  .addrow[hidden] { display: none; }
  .addrow input { flex: 1; }
  .check { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

  /* Product visual */
  .pimg {
    width: 76px; height: 76px; flex: none; border-radius: 16px; overflow: hidden;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--line); display: grid; place-items: center;
  }
  .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pimg.sm { width: 48px; height: 48px; border-radius: 12px; }
  .pimg.lg { width: 112px; height: 112px; border-radius: 20px; }

  /* Narrow screens: cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .pcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .pcard.off { background: var(--page); }
  .phead { display: flex; gap: 14px; align-items: center; }
  .pname { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; }
  .psub { font-size: 14px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
  .kv dt { font-size: 13px; color: var(--muted); }
  .kv dd { margin: 0; font-size: 16px; font-weight: 600; }
  .chip {
    display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: var(--accent-soft); color: var(--accent);
  }
  .chip.off { background: var(--line); color: var(--muted); }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .abtn {
    min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .abtn:active { background: var(--accent-soft); }
  .abtn.del { color: var(--danger); }

  /* Wide screens (Windows): table */
  .tbl-wrap { display: none; }
  @media (min-width: 900px) {
    .cards { display: none; }
    .tbl-wrap { display: block; }
  }
  .tbl {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .tbl th {
    text-align: left; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 12px 14px; background: var(--page); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .tbl td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
  .tbl tbody tr:first-child td { border-top: 0; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl tr.off td:not(.st):not(.ac) > * { opacity: .55; }
  .tcell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .tcell .pname { font-size: 16px; }
  .tcell .psub { font-size: 13px; }
  .tact { display: flex; gap: 6px; justify-content: flex-end; }
  .ibtn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  .ibtn:active, .ibtn:hover { background: var(--accent-soft); }
  .ibtn.del { color: var(--danger); }
  .ibtn.del:hover { background: var(--danger-soft); }
  @media (hover: hover) { .tbl tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); } }

  /* Empty state */
  .empty {
    text-align: center; padding: 56px 20px; border-radius: 18px;
    border: 1px dashed var(--line); background: var(--surface);
  }
  .empty .pimg { margin: 0 auto 14px; width: 72px; height: 72px; }
  .empty h3 { margin: 0 0 6px; font-size: 18px; }
  .empty p { margin: 0 0 18px; color: var(--muted); }
  .empty .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Dialogs */
  dialog.dlg {
    padding: 0; border: 0; border-radius: 20px; color: var(--ink); background: var(--surface);
    width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
  }
  dialog.dlg.narrow { width: min(420px, calc(100vw - 32px)); }
  dialog.dlg[open] { display: flex; flex-direction: column; }
  dialog.dlg::backdrop { background: rgba(15, 17, 23, .55); }
  .dh {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px 10px 22px; border-bottom: 1px solid var(--line); flex: none;
  }
  .dh h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .db { padding: 6px 22px 20px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  .df {
    display: flex; gap: 10px; padding: 12px 22px calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--line); flex: none;
  }
  .df .btn { flex: 1; }
  @media (min-width: 640px) { .df { justify-content: flex-end; } .df .btn { flex: 0 0 auto; min-width: 140px; } }
  @media (max-width: 639px) {
    dialog.dlg:not(.narrow) {
      width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0;
    }
  }
  .sec {
    margin: 22px 0 14px; padding-bottom: 8px; font-size: 16px; font-weight: 700; color: var(--accent);
    border-bottom: 2px solid var(--accent-soft);
  }
  .sec:first-child { margin-top: 14px; }
  .fg { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .fg { grid-template-columns: 1fr 1fr; } .fg .full { grid-column: 1 / -1; } }
  .imgrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hint { font-size: 13px; color: var(--muted); min-height: 20px; }
  .hint.warn { color: var(--warn); }
  .detail-top { display: flex; gap: 16px; align-items: center; margin: 16px 0 8px; }
  .detail-top .pname { font-size: 20px; }
  .detail-desc { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--page); white-space: pre-wrap; }
  .confirm-text { margin: 20px 0 6px; font-size: 16px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 12px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* =====================================================
     ဝယ်ယူမှု (Purchase) page
     ===================================================== */
  .field input[type=date] {
    width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px;
  }
  .field input[type=date]:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pickres { margin-top: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .pickres[hidden] { display: none; }
  .pick {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px;
    border: 0; border-top: 1px solid var(--line); background: transparent;
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  }
  .pick:first-child { border-top: 0; }
  .pick:active, .pick:hover { background: var(--accent-soft); }
  .irow { border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 10px; background: var(--surface); }
  .ihead { display: flex; align-items: center; gap: 12px; }
  .ihead .iname { flex: 1; min-width: 0; }
  .igrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .igrid .field:last-child { grid-column: 1 / -1; }
  @media (min-width: 640px) { .igrid { grid-template-columns: 1fr 1fr 1fr; } .igrid .field:last-child { grid-column: auto; } }
  .ltotal { min-height: 46px; display: flex; align-items: center; font-weight: 600; font-size: 16px; }
  .tot { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--page); display: grid; gap: 6px; }
  .tot > div { display: flex; justify-content: space-between; gap: 12px; }
  .tot .grand { font-size: 18px; font-weight: 700; }
  .vrow { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .due { color: var(--danger); font-weight: 600; }
  .chip.debt { background: var(--danger-soft); color: var(--danger); }

  /* ---------- အသုံးစရိတ် (Expense) ---------- */
  .xp-filter {
    flex: 1 1 0; min-width: 0; min-height: 46px; padding: 0 12px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px;
  }
  .xp-filter:focus { outline: 0; border-color: var(--accent); }
  .xp-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .xp-chips button {
    min-height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 14px;
  }
  .xp-chips button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .xp-break { margin: 14px 0 4px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; }
  .xp-b {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px;
    border-top: 1px solid var(--line);
    background: linear-gradient(to right, var(--accent-soft) var(--p, 0%), transparent var(--p, 0%));
  }
  .xp-b:first-child { border-top: 0; }
  .xp-b b { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

</style>
</head>
<body data-page="closing" data-title="နေ့စဉ် ငွေစာရင်းပိတ်">

<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="မီနူး ဖွင့်ရန်">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 id="pageTitle">ဝယ်ယူမှု</h1>
  </header>
  <main id="content"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<nav class="drawer" id="drawer" aria-label="အဓိက မီနူး"></nav>

<script>
/* ---------- Icons (24x24, stroke) ---------- */
const ICONS = {
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  cart: '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.7 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 7H6"/>',
  truck: '<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  userPlus: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>',
  building: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
  store: '<path d="M3 12l3-8h12l3 8v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 12h5l1 3h6l1-3h5"/>',
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h13v4"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 13.5h2"/>',
  plusCircle: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',

function setActive(id, label) {
  activeId = id;

    const open = sub.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open);

/* ---------- Multi-page navigation ---------- */
const ROUTES = {
  'products/list': 'products.html', 'products/new': 'products.html?new=1',
  'purchase/list': 'purchase.html', 'purchase/new': 'purchase.html?new=1',
  'summary': 'index.html', 'retail': 'retail.html',

  'r-purchase/view': 'reports.html?p=r-purchase%2Fview', 'r-sales/view': 'reports.html?p=r-sales%2Fview', 'r-cash/view': 'reports.html?p=r-cash%2Fview', 'r-adjust/view': 'reports.html?p=r-adjust%2Fview', 'r-stock': 'reports.html?p=r-stock', 'r-profit': 'reports.html?p=r-profit', 'r-expense': 'reports.html?p=r-expense',
};
function go(id, label) {
  const target = ROUTES[id] || 'index.html?p=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(label);
  const here = location.pathname.split('/').pop() || 'index.html';
  if (target.split('?')[0] === here) setActive(id, label);   // same page: no reload
  else location.href = target;
}

const closeMenu = () => document.body.classList.remove('menu-open');
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('backdrop').addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ---------- Swipe: open from left edge, close by swiping left ---------- */
const DRAWER_W = () => drawer.getBoundingClientRect().width || 300;
let startX = 0, startY = 0, dx = 0, mode = null;

document.addEventListener('touchstart', e => {
  if (window.matchMedia('(min-width: 1024px)').matches) return;
  const t = e.touches[0];
  startX = t.clientX; startY = t.clientY; dx = 0; mode = null;
  const isOpen = document.body.classList.contains('menu-open');
  if (!isOpen && startX < 20) mode = 'open';
  else if (isOpen) mode = 'close';
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!mode) return;
  const t = e.touches[0];
  dx = t.clientX - startX;
  if (Math.abs(t.clientY - startY) > Math.abs(dx) && !document.body.classList.contains('dragging')) { mode = null; return; }
  document.body.classList.add('dragging');
  const w = DRAWER_W();
  const x = mode === 'open' ? Math.min(0, -w + dx) : Math.min(0, dx);
  drawer.style.transform = `translateX(${x}px)`;
  document.getElementById('backdrop').style.opacity = String(1 + x / w);
  document.getElementById('backdrop').style.pointerEvents = 'auto';
}, { passive: true });

document.addEventListener('touchend', () => {
  if (!mode) return;
  document.body.classList.remove('dragging');
  drawer.style.transform = '';
  const bd = document.getElementById('backdrop');
  bd.style.opacity = ''; bd.style.pointerEvents = '';
  if (mode === 'open' && dx > 80) openMenu();
  if (mode === 'close' && dx < -80) closeMenu();
  mode = null;
});

render();

<script>
/* Shared data layer + helpers (used by products.js and purchase.js) */
(() => {
Object.assign(ICONS, {
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  filter: '<path d="M4 7h16M7 12h10M10 17h4"/>',
  plus:   '<path d="M12 5v14M5 12h14"/>',
  eye:    '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  edit:   '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  power:  '<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',
  trash:  '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
  x:      '<path d="M6 6l12 12M18 6L6 18"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
});


const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('pos-db', 5);
      r.onupgradeneeded = () => {
        const db = r.result;
        ['products', 'categories', 'units', 'meta', 'purchases', 'sales', 'expenses', 'adjustments', 'customers', 'suppliers'].forEach(n => {
          if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: 'id' });
        });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  all(n) {
    return new Promise((res, rej) => {
      const q = this.db.transaction(n).objectStore(n).getAll();
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  put(n, o) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(n, 'readwrite'); t.objectStore(n).put(o);
      t.oncomplete = () => res(o); t.onerror = () => rej(t.error);
    });
  },
  del(n, id) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(n, 'readwrite'); t.objectStore(n).delete(id);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
    });
  },
};

/* ---------- Defaults (categories & units are editable by the user) ---------- */
const DEFAULT_CATEGORIES = ['ကလေးသုံးပစ္စည်း', 'အစားအသောက်', 'အိမ်သုံးပစ္စည်း', 'အလှကုန်']
  .map((name, i) => ({ id: 'c' + (i + 1), name }));
// group 'weight' + ratio: 1 ပိဿာ = 100 ကျပ်သား (base weight unit = ကျပ်သား)
const DEFAULT_UNITS = [
  { name: 'ခု' }, { name: 'ထုပ်' }, { name: 'အထုပ်' }, { name: 'ဘူး' }, { name: 'ဗူး' }, { name: 'ဒါဇင်' },
  { name: 'ပိဿာ', group: 'weight', ratio: 100 }, { name: 'ကျပ်သား', group: 'weight', ratio: 1 },
  { name: 'ပေါင်', group: 'weight' }, { name: 'ကီလို', group: 'weight' }, { name: 'လီတာ' },
].map((u, i) => ({ id: 'u' + (i + 1), group: 'count', ...u }));

const S = { products: [], categories: [], units: [], purchases: [], seq: 0, poSeq: 0 };
let storeError = null;

async function initStore() {
  await idb.open();
  S.products   = await idb.all('products');
  S.categories = await idb.all('categories');
  S.units      = await idb.all('units');
  const meta = await idb.all('meta');
  S.purchases  = await idb.all('purchases');
  S.seq = (meta.find(m => m.id === 'seq') || {}).value || 0;
  S.poSeq = (meta.find(m => m.id === 'poSeq') || {}).value || 0;
  if (!meta.some(m => m.id === 'seeded')) {
    for (const c of DEFAULT_CATEGORIES) { await idb.put('categories', c); S.categories.push(c); }
    for (const u of DEFAULT_UNITS)      { await idb.put('units', u);      S.units.push(u); }
    await idb.put('meta', { id: 'seeded', value: 1 });
  }
}
const ready = initStore().catch(err => { storeError = err; console.error(err); });

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const F = id => document.getElementById('f-' + id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const find = id => S.products.find(p => p.id === id);
const parsePrice = x => {
  const s = String(x ?? '').trim(); if (s === '') return null;
  const n = Number(s); return Number.isFinite(n) && n >= 0 ? Math.round(n) : null;
};
const thumb = (p, cls = '') =>
  `<div class="pimg ${cls}">${p.image ? `<img src="${p.image}" alt="">` : svg('box', cls === 'sm' ? 22 : cls === 'lg' ? 44 : 34)}</div>`;

let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function fileToThumb(file, max = 240) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}


/* ---------- Shared dialogs (confirm + toast + close buttons) ---------- */
function ensureShared() {
  if ($('#cdlg')) return;
  document.body.insertAdjacentHTML('beforeend', `
<dialog class="dlg narrow" id="cdlg">
  <form method="dialog">
    <div class="db"><p class="confirm-text" id="cText"></p></div>
    <div class="df">
      <button class="btn" value="no">မလုပ်တော့ပါ</button>

    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>`);
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-close]'); if (b) b.closest('dialog').close();
  });
}

function ask(text, okLabel = 'ဖျက်မည်') {
  return new Promise(res => {
    const d = $('#cdlg'); $('#cText').textContent = text; $('#cOk').textContent = okLabel;
    d.returnValue = ''; d.addEventListener('close', () => res(d.returnValue === 'ok'), { once: true });
    d.showModal();
  });
}


window.POS = { idb, S, ready, storeError: () => storeError, ensureShared,
  $, F, esc, money, qty, uid, norm, toast, ask, thumb, titleOf, subOf, find, parsePrice,
  catName, unitName, fileToThumb, DEFAULT_UNITS };
})();

<script>
/* နေ့စဉ် ငွေစာရင်းပိတ် (Daily cash closing) — needs the shared data layer above.
   ငွေအဝင်/အထွက် တွက်ပုံသည် reports.html ရှိ "အဝင်အထွက် အစီရင်ခံစာ" (cashDays) နှင့် တူညီသည်။ */
(() => {
const { idb, ready, $, esc, money, ask, toast, parsePrice } = window.POS;

const pad = n => String(n).padStart(2, '0');
const ymdOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ymd = ts => ymdOf(new Date(ts));
const today = () => ymdOf(new Date());
const dmy = s => (s ? s.split('-').reverse().join('/') : '-');
const sum = (a, f) => a.reduce((x, o) => x + f(o), 0);

/*CALC-START*/
const ownDelInc = s => (s.delivery && s.delivery.mode === 'own') ? (Number(s.deliveryCharge) || 0) : 0;   // own-delivery charge = shop income
function calcDay(d, sales, purchases, expenses) {
  const r = { cashSales: 0, collected: 0, cod: 0, buy: 0, debt: 0, exp: 0, nSales: 0, totalSales: 0, discount: 0, creditGiven: 0 };
  sales.forEach(s => {
    const pays = s.payments || [], created = ymd(s.createdAt);
    if (created === d) { r.nSales++; r.totalSales += s.total || 0; r.discount += s.discount || 0; }
    if (s.credit) {                                          // credit sale: only what was paid counts
      const first = Math.max(0, (s.paid || 0) - sum(pays, x => x.amount));
      if (created === d) { r.cashSales += first; r.creditGiven += Math.max(0, (s.total || 0) + (Number(s.deliveryCharge) || 0) - first); }
      pays.forEach(x => { if (x.date === d) r.collected += x.amount; });
    }
    else if (!s.delivery) { if (created === d) r.cashSales += s.total; }
    else if (!s.delivery.cod) { if (created === d) r.cashSales += s.total + ownDelInc(s); }           // paid up-front
    else if (s.delivery.status === 'settled') { if (ymd(s.delivery.settledAt || s.createdAt) === d) r.cod += s.delivery.received || 0; }   // COD: cash arrives on settlement
  });
  purchases.forEach(p => {
    const pays = p.payments || [];
    if (p.date === d) r.buy += Math.max(0, (p.paid || 0) - sum(pays, x => x.amount));   // paid when buying
    pays.forEach(x => { if (x.date === d) r.debt += x.amount; });                       // paid later (debt payment)
  });
  expenses.forEach(e => { if (e.date === d) r.exp += e.amount; });
  r.cashIn = r.cashSales + r.collected + r.cod;
  r.cashOut = r.buy + r.debt + r.exp;
  return r;
}
/*CALC-END*/

const C = { sales: [], purchases: [], expenses: [], closings: [], failed: false };
let date = today();

async function load() {
  await ready;
  if (window.POS.storeError()) return;
  C.sales = await idb.all('sales');
  C.purchases = await idb.all('purchases');
  C.expenses = await idb.all('expenses');
  C.closings = (await idb.all('meta')).filter(m => String(m.id).startsWith('close-'));
}
const loaded = load().catch(err => { C.failed = true; console.error(err); });

const closeOf = d => C.closings.find(c => c.id === 'close-' + d);
const prevClose = d => C.closings.filter(c => c.date < d).sort((a, b) => b.date.localeCompare(a.date))[0] || null;
const calc = d => calcDay(d, C.sales, C.purchases, C.expenses);
const el = id => document.getElementById(id);
const diffHtml = n => n === 0 ? '<b class="cl-ok">ကိုက်ညီသည်</b>'
  : n > 0 ? `<b class="cl-over">ငွေပို ${money(n)}</b>` : `<b class="cl-short">ငွေလို ${money(-n)}</b>`;

/* ---------- page ---------- */
function mount() {
  $('#content').innerHTML = `
<div class="pg cl">
<style>
  .cl-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
  .cl h2.cl-h { font-size: 15px; font-weight: 600; margin: 20px 2px 0; }
  .cl-daterow { display: flex; gap: 10px; align-items: stretch; }
  .cl-daterow input { flex: 1; min-width: 0; }
  .cl-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .cl-row.in b { color: #16a34a; } .cl-row.out b { color: var(--danger); }
  .cl-row.sub { color: var(--muted); font-size: 14px; }
  .cl-row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-size: 18px; font-weight: 700; }
  .cl-diff { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--page); display: flex; justify-content: space-between; gap: 12px; font-size: 16px; }
  .cl-ok { color: #16a34a; } .cl-over { color: var(--accent); } .cl-short { color: var(--danger); }
  .cl-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .cl-actions .btn { flex: 1; min-width: 140px; }
  .cl-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .cl-dchip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .cl-hrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .cl-hrow:first-child { border-top: 0; }
  .cl-hrow small { display: block; color: var(--muted); }
  .cl-empty { color: var(--muted); padding: 6px 0; }
</style>

<div class="cl-card">
  <div class="field"><label for="cl-date">ရက်စွဲ</label>
    <div class="cl-daterow"><input type="date" id="cl-date"><button type="button" class="btn small" id="cl-today">ယနေ့</button></div></div>
  <div style="margin-top:10px" id="cl-status"></div>
  <div id="cl-unclosed"></div>
</div>

<div class="cl-card">
  <div class="field"><label for="cl-open">ဆိုင်ဖွင့်ငွေ (ကျပ်)</label>
    <input type="number" id="cl-open" min="0" step="1" inputmode="numeric"><div class="help" id="cl-openhelp"></div></div>
  <div id="cl-break" style="margin-top:8px"></div>
</div>

<div class="cl-card">
  <div class="field" id="w-cl-counted"><label for="cl-counted">တကယ် ရေတွက်ရသောငွေ (ကျပ်)</label>
    <input type="number" id="cl-counted" min="0" step="1" inputmode="numeric" placeholder="ကျန်ငွေ ရေတွက်ပြီး ထည့်ပါ"><div class="msg"></div></div>
  <div class="cl-diff" id="cl-diff"></div>
  <div class="field" style="margin-top:12px"><label for="cl-note">မှတ်ချက်</label>
    <input type="text" id="cl-note" autocomplete="off" placeholder="ဥပမာ - ပိုနေ/လိုနေရသည့် အကြောင်းရင်း"></div>
  <div class="cl-actions">
    <button type="button" class="btn primary" id="cl-save">စာရင်းပိတ်မည်</button>
    <button type="button" class="btn" id="cl-del" hidden>ပိတ်ထားသည်ကို ဖျက်မည်</button>
  </div>
</div>

<h2 class="cl-h" id="cl-stitle">ရောင်းချမှု အနှစ်ချုပ်</h2>
<div class="cl-card" id="cl-stats"></div>

<h2 class="cl-h">ပိတ်ပြီးသော မှတ်တမ်းများ</h2>
<div class="cl-card" id="cl-hist"></div>
</div>`;

  el('cl-date').addEventListener('change', e => { date = e.target.value || today(); refresh(true); });
  el('cl-today').addEventListener('click', () => { date = today(); refresh(true); });
  el('cl-open').addEventListener('input', recompute);
  el('cl-counted').addEventListener('input', recompute);
  el('cl-save').addEventListener('click', save);
  el('cl-del').addEventListener('click', removeClose);
  el('cl-unclosed').addEventListener('click', jump);
  el('cl-hist').addEventListener('click', jump);
  refresh(true);
}

function jump(e) {
  const b = e.target.closest('[data-d]'); if (!b) return;
  date = b.dataset.d; refresh(true); window.scrollTo(0, 0); const m = $('main'); if (m) m.scrollTop = 0;
}

let R = null;                                  // numbers for the selected date
function refresh(loadInputs) {
  R = calc(date);
  const ex = closeOf(date), prev = prevClose(date);
  el('cl-date').value = date;
  if (loadInputs) {
    el('cl-open').value = ex ? ex.opening : (prev ? prev.counted : 0);
    el('cl-counted').value = ex ? ex.counted : '';
    el('cl-note').value = ex ? (ex.note || '') : '';
  }
  el('cl-openhelp').textContent = ex ? '' : prev ? `${dmy(prev.date)} က ပိတ်ထားသော ငွေကို ယူထားသည် (ပြင်လို့ရသည်)` : 'ပထမဆုံးအကြိမ် — ဆိုင်ဖွင့်ငွေကို ကိုယ်တိုင် ထည့်ပါ';
  el('cl-status').innerHTML = ex ? `<span class="chip">ပိတ်ပြီးသား · ${dmy(date)}</span>` : `<span class="chip off">မပိတ်ရသေးပါ · ${dmy(date)}</span>`;
  el('cl-save').textContent = ex ? 'ပြန်ပိတ်မည် (အစားထိုး)' : 'စာရင်းပိတ်မည်';
  el('cl-del').hidden = !ex;

  const t = new Date(), un = [];                         // activity in the last 14 days that was never closed
  for (let k = 1; k <= 14; k++) {
    const d = ymdOf(new Date(t.getFullYear(), t.getMonth(), t.getDate() - k));
    if (d === date || closeOf(d)) continue;
    const x = calc(d); if (x.nSales || x.cashIn || x.cashOut) un.push(d);
  }
  el('cl-unclosed').innerHTML = un.length ? `<div class="help" style="margin-top:12px">မပိတ်ရသေးသော ရက်များ - နှိပ်၍ ပိတ်ပါ</div>
    <div class="cl-chips">${un.map(d => `<button type="button" class="cl-dchip" data-d="${d}">${dmy(d)}</button>`).join('')}</div>` : '';

  el('cl-stitle').textContent = `ရောင်းချမှု အနှစ်ချုပ် (${dmy(date)})`;
  el('cl-stats').innerHTML = `
    <div class="cl-row"><span>ရောင်းချမှု</span><b>${R.nSales} ကြိမ်</b></div>
    <div class="cl-row"><span>ရောင်းရငွေ စုစုပေါင်း</span><b>${money(R.totalSales)}</b></div>
    <div class="cl-row"><span>လျှော့စျေး</span><b>${money(R.discount)}</b></div>
    <div class="cl-row"><span>အကြွေးရောင်း (ငွေမရသေး)</span><b>${money(R.creditGiven)}</b></div>`;

  const cs = [...C.closings].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);
  el('cl-hist').innerHTML = cs.length ? cs.map(c => `<button type="button" class="cl-hrow" data-d="${c.date}">
      <span>${dmy(c.date)}<small>ရှိသင့် ${money(c.expected)} · ရေတွက် ${money(c.counted)}</small></span><span>${diffHtml(c.diff)}</span></button>`).join('')
    : '<div class="cl-empty">စာရင်းပိတ်ထားသော မှတ်တမ်း မရှိသေးပါ</div>';
  recompute();
}

function recompute() {
  const open = parsePrice(el('cl-open').value) || 0;
  const expected = open + R.cashIn - R.cashOut;
  const row = (cls, l, v) => `<div class="cl-row ${cls}"><span>${l}</span><b>${v}</b></div>`;
  el('cl-break').innerHTML =
    row('', 'ဆိုင်ဖွင့်ငွေ', money(open)) +
    row('in', '+ ငွေသား ရောင်းရငွေ', money(R.cashSales)) +
    row('in', '+ အကြွေး ပြန်ရငွေ (ဖောက်သည်)', money(R.collected)) +
    row('in', '+ COD ငွေလက်ခံ', money(R.cod)) +
    row('out', '− ဝယ်ယူမှု ပေးငွေ', money(R.buy)) +
    row('out', '− အကြွေး ပေးချေငွေ (ပစ္စည်းသွင်းသူ)', money(R.debt)) +
    row('out', '− အသုံးစရိတ်', money(R.exp)) +
    row('total', 'ရှိသင့်သောငွေ', money(expected));
  const raw = el('cl-counted').value.trim();
  const counted = raw === '' ? null : parsePrice(raw);
  el('cl-diff').innerHTML = counted === null
    ? '<span style="color:var(--muted)">ရေတွက်ရသောငွေ ထည့်ပါ</span><span></span>'
    : `<span>ကွာခြားချက်</span>${diffHtml(counted - expected)}`;
  return { open, expected, counted };
}

async function save() {
  const { open, expected, counted } = recompute();
  const w = el('w-cl-counted');
  if (counted === null) {
    w.classList.add('err'); w.querySelector('.msg').textContent = 'ရေတွက်ရသောငွေ ထည့်ပါ (0 သို့မဟုတ် ပိုများသော ဂဏန်း)'; el('cl-counted').focus(); return;
  }
  w.classList.remove('err');
  const ex = closeOf(date);
  if (ex && !(await ask(`${dmy(date)} အတွက် စာရင်းပိတ်ပြီးသားပါ။ အသစ်ဖြင့် အစားထိုးမလား?`, 'အစားထိုးမည်'))) return;
  const rec = {
    id: 'close-' + date, date, opening: open, cashIn: R.cashIn, cashOut: R.cashOut, expected, counted,
    diff: counted - expected, note: el('cl-note').value.trim(), createdAt: Date.now(),
    breakdown: { cashSales: R.cashSales, collected: R.collected, cod: R.cod, buy: R.buy, debt: R.debt, exp: R.exp },
  };
  try { await idb.put('meta', rec); } catch (err) { console.error(err); return toast('သိမ်း၍ မရပါ'); }
  C.closings = C.closings.filter(c => c.id !== rec.id).concat(rec);
  refresh(true);
  toast(rec.diff === 0 ? 'စာရင်းပိတ်ပြီးပါပြီ — ကိုက်ညီသည်' : 'စာရင်းပိတ်ပြီးပါပြီ');
}

async function removeClose() {
  const ex = closeOf(date); if (!ex) return;
  if (!(await ask(`${dmy(date)} ၏ စာရင်းပိတ်မှတ်တမ်းကို ဖျက်မလား?`))) return;
  try { await idb.del('meta', ex.id); } catch (err) { console.error(err); return toast('ဖျက်၍ မရပါ'); }
  C.closings = C.closings.filter(c => c.id !== ex.id);
  refresh(true); toast('ဖျက်ပြီးပါပြီ');
}

/* ---------- Routing hook ---------- */
window.showPage = async function () {
  titleEl.textContent = 'နေ့စဉ် ငွေစာရင်းပိတ်';
  await ready; await loaded;
  const content = $('#content');
  if (window.POS.storeError() || C.failed) {
    content.innerHTML = `<div class="empty"><h3>ဒေတာသိမ်းစနစ် မဖွင့်နိုင်ပါ</h3>
      <p>တခြား tab တွေကို ပိတ်ပြီး စာမျက်နှာကို ပြန် refresh လုပ်ပါ။ Chrome သို့မဟုတ် Edge ဖြင့် ဖွင့်ပါ (Private/Incognito mode တွင် အလုပ်မလုပ်နိုင်ပါ)</p></div>`;
    return;
  }
  window.POS.ensureShared();
  const q = new URLSearchParams(location.search).get('date');
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) date = q;
  mount();
};
})();

<script>
/* Runs last on every page: opens the right page + highlights the menu */
(() => {
  const q = new URLSearchParams(location.search);
  let id = document.body.dataset.page || 'summary';
  let label = document.body.dataset.title || 'အနှစ်ချုပ်';
  if (q.get('p')) { id = q.get('p'); label = q.get('t') || label; }
  if (q.get('new')) id = id.split('/')[0] + '/new';
  const parent = id.split('/')[0];                       // open the submenu that holds the active item
  const sub = drawer.querySelector(`.sub[data-parent="${CSS.escape(parent)}"]`);
  if (sub) {
    sub.classList.add('open');
    const head = sub.previousElementSibling;
    if (head) { head.classList.add('open'); head.setAttribute('aria-expanded', 'true'); }
  }
  setActive(id, label);
})();
</script>
