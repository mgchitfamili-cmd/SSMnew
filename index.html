<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #7c3aed;
    --accent-soft: #ede9fe;
    --ink: #1f2937;
    --muted: #9ca3af;
    --line: #e5e7eb;
    --surface: #ffffff;
    --page: #f3f4f8;
    --drawer-w: min(320px, 86vw);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #a78bfa;
      --accent-soft: #2e2457;
      --ink: #e5e7eb;
      --muted: #6b7280;
      --line: #2b2f3a;
      --surface: #171a22;
      --page: #0f1117;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans Myanmar", "Padauk", system-ui, sans-serif;
    background: var(--page);
    color: var(--ink);
    line-height: 1.6;
    overflow: hidden;
  }

  /* ---------- Top bar + main ---------- */
  .app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: calc(var(--safe-top) + 8px) 12px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 12px;
    background: transparent; color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--accent-soft); }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  main { flex: 1; overflow: auto; padding: 20px; }
  main p { color: var(--muted); margin: 4px 0 0; }

  /* ---------- Drawer ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(15, 17, 23, .5);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 40;
  }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: var(--drawer-w);
    background: var(--surface);
    transform: translateX(-100%);
    transition: transform .28s cubic-bezier(.3, .8, .3, 1);
    z-index: 50;
    overflow-y: auto; overscroll-behavior: contain;
    padding: calc(var(--safe-top) + 12px) 0 calc(var(--safe-bottom) + 24px);
    box-shadow: 4px 0 24px rgba(0, 0, 0, .15);
  }
  body.menu-open .drawer { transform: none; }
  body.menu-open .backdrop { opacity: 1; pointer-events: auto; }
  body.dragging .drawer, body.dragging .backdrop { transition: none; }

  .group-title {
    margin: 18px 20px 6px; font-size: 14px; font-weight: 700; color: var(--ink);
  }
  .group-title:first-child { margin-top: 8px; }

  .item {
    display: flex; align-items: center; gap: 16px;
    width: calc(100% - 24px); margin: 0 12px;
    min-height: 48px; padding: 0 12px;
    border: 0; border-radius: 12px; background: transparent;
    font: inherit; font-size: 16px; color: var(--ink); text-align: left;
    cursor: pointer;
  }
  .item:active { background: var(--accent-soft); }
  .item svg { flex: none; }
  .item .label { flex: 1; }
  .item .chev { transition: transform .2s; color: var(--ink); }
  .item.open .chev { transform: rotate(180deg); }
  .item.active { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
  .item.disabled { color: var(--muted); }
  .item.disabled .chev { color: var(--muted); }

  .sub { display: none; margin: 0 12px 4px 56px; border-left: 2px solid var(--line); }
  .sub.open { display: block; }
  .sub .item { width: 100%; margin: 0; min-height: 42px; font-size: 15px; padding-left: 16px; }

  /* Wide screens (iPad landscape): menu stays visible */
  @media (min-width: 1024px) {
    .drawer { transform: none; box-shadow: none; border-right: 1px solid var(--line); }
    .backdrop { display: none; }
    .app { margin-left: var(--drawer-w); }
    #menuBtn { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .backdrop, .item .chev { transition: none; }
  }

  /* =====================================================
     ကုန်ပစ္စည်း (Products) page
     ===================================================== */
  :root {
    --on-accent: #ffffff;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --on-accent: #1b1033;
      --danger: #f87171;
      --danger-soft: #3b1c1c;
      --warn: #fbbf24;
    }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pg { max-width: 1240px; margin: 0 auto; }

  /* Buttons */
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap;
  }
  .btn:active { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:active { filter: brightness(.92); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .btn.small { min-height: 40px; padding: 0 14px; }
  @media (hover: hover) {
    .btn:hover { border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.06); }
  }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700;
    display: inline-grid; place-items: center;
  }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .search {
    flex: 1 1 100%; display: flex; align-items: center; gap: 10px;
    min-height: 46px; padding: 0 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  }
  .search:focus-within { border-color: var(--accent); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 15px; color: var(--ink); height: 44px;
  }
  .toolbar .btn { flex: 1 1 0; }
  @media (min-width: 700px) {
    .search { flex: 1 1 320px; }
    .toolbar .btn { flex: 0 0 auto; }
  }
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
    margin-top: 12px; padding: 14px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .filters[hidden] { display: none; }
  .filters .reset { align-self: end; }
  .count { margin: 14px 2px 10px; font-size: 14px; color: var(--muted); }

  /* Form controls */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .flabel { font-size: 14px; font-weight: 500; }
  .field .req { color: var(--danger); margin-left: 3px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea, .addrow input {
    width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px;
  }
  .field textarea { min-height: 96px; padding: 10px 14px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus, .addrow input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field .help { font-size: 13px; color: var(--muted); }
  .field .msg { font-size: 13px; color: var(--danger); display: none; }
  .field.err input, .field.err select { border-color: var(--danger); }
  .field.err .msg { display: block; }
  .linkbtn {
    align-self: flex-start; border: 0; background: none; padding: 4px 0; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: underline;
  }
  .addrow { display: flex; gap: 8px; }
  .addrow[hidden] { display: none; }
  .addrow input { flex: 1; }
  .check { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

  /* Product visual */
  .pimg {
    width: 76px; height: 76px; flex: none; border-radius: 16px; overflow: hidden;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--line); display: grid; place-items: center;
  }
  .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pimg.sm { width: 48px; height: 48px; border-radius: 12px; }
  .pimg.lg { width: 112px; height: 112px; border-radius: 20px; }

  /* Narrow screens: cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .pcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .pcard.off { background: var(--page); }
  .phead { display: flex; gap: 14px; align-items: center; }
  .pname { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; }
  .psub { font-size: 14px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
  .kv dt { font-size: 13px; color: var(--muted); }
  .kv dd { margin: 0; font-size: 16px; font-weight: 600; }
  .chip {
    display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: var(--accent-soft); color: var(--accent);
  }
  .chip.off { background: var(--line); color: var(--muted); }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .abtn {
    min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .abtn:active { background: var(--accent-soft); }
  .abtn.del { color: var(--danger); }

  /* Wide screens (Windows): table */
  .tbl-wrap { display: none; }
  @media (min-width: 900px) {
    .cards { display: none; }
    .tbl-wrap { display: block; }
  }
  .tbl {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .tbl th {
    text-align: left; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 12px 14px; background: var(--page); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .tbl td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
  .tbl tbody tr:first-child td { border-top: 0; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl tr.off td:not(.st):not(.ac) > * { opacity: .55; }
  .tcell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .tcell .pname { font-size: 16px; }
  .tcell .psub { font-size: 13px; }
  .tact { display: flex; gap: 6px; justify-content: flex-end; }
  .ibtn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  .ibtn:active, .ibtn:hover { background: var(--accent-soft); }
  .ibtn.del { color: var(--danger); }
  .ibtn.del:hover { background: var(--danger-soft); }
  @media (hover: hover) { .tbl tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); } }

  /* Empty state */
  .empty {
    text-align: center; padding: 56px 20px; border-radius: 18px;
    border: 1px dashed var(--line); background: var(--surface);
  }
  .empty .pimg { margin: 0 auto 14px; width: 72px; height: 72px; }
  .empty h3 { margin: 0 0 6px; font-size: 18px; }
  .empty p { margin: 0 0 18px; color: var(--muted); }
  .empty .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Dialogs */
  dialog.dlg {
    padding: 0; border: 0; border-radius: 20px; color: var(--ink); background: var(--surface);
    width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
  }
  dialog.dlg.narrow { width: min(420px, calc(100vw - 32px)); }
  dialog.dlg[open] { display: flex; flex-direction: column; }
  dialog.dlg::backdrop { background: rgba(15, 17, 23, .55); }
  .dh {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px 10px 22px; border-bottom: 1px solid var(--line); flex: none;
  }
  .dh h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .db { padding: 6px 22px 20px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  .df {
    display: flex; gap: 10px; padding: 12px 22px calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--line); flex: none;
  }
  .df .btn { flex: 1; }
  @media (min-width: 640px) { .df { justify-content: flex-end; } .df .btn { flex: 0 0 auto; min-width: 140px; } }
  @media (max-width: 639px) {
    dialog.dlg:not(.narrow) {
      width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0;
    }
  }
  .sec {
    margin: 22px 0 14px; padding-bottom: 8px; font-size: 16px; font-weight: 700; color: var(--accent);
    border-bottom: 2px solid var(--accent-soft);
  }
  .sec:first-child { margin-top: 14px; }
  .fg { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .fg { grid-template-columns: 1fr 1fr; } .fg .full { grid-column: 1 / -1; } }
  .imgrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hint { font-size: 13px; color: var(--muted); min-height: 20px; }
  .hint.warn { color: var(--warn); }
  .detail-top { display: flex; gap: 16px; align-items: center; margin: 16px 0 8px; }
  .detail-top .pname { font-size: 20px; }
  .detail-desc { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--page); white-space: pre-wrap; }
  .confirm-text { margin: 20px 0 6px; font-size: 16px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 12px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="မီနူး ဖွင့်ရန်">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 id="pageTitle">အနှစ်ချုပ်</h1>
  </header>
  <main id="content">
    <p>ဒီနေရာမှာ စာမျက်နှာ အကြောင်းအရာ ထည့်ပါမယ်။</p>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>
<nav class="drawer" id="drawer" aria-label="အဓိက မီနူး"></nav>

<script>
/* ---------- Icons (24x24, stroke) ---------- */
const ICONS = {
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  cart: '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.7 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 7H6"/>',
  truck: '<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  userPlus: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>',
  building: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
  store: '<path d="M3 12l3-8h12l3 8v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 12h5l1 3h6l1-3h5"/>',
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h13v4"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 13.5h2"/>',
  plusCircle: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  box: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
  bag: '<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  percent: '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  bars: '<path d="M3 3v18h18"/><path d="M8 17v-5M12 17V8M16 17v-3M20 17v-7"/>',
  swap: '<path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>',
  gear: '<circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
  dollar: '<path d="M12 2v20M17 6.5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  minusCircle: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  card: '<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  fileX: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M10 12.5l4 4M14 12.5l-4 4"/>',
  fileIn: '<path d="M14 3H7a2 2 0 0 0-2 2v6M14 3l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-2"/><path d="M2 14h9M8 11l3 3-3 3"/>',
  fileOut: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M13 11l3 3-3 3"/>',
  list: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  printer: '<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  chevron: '<path d="M6 9l6 6 6-6"/>'
};
const svg = (name, size = 24) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

/* ---------- Menu data ----------
   sub: true  -> expandable (children are placeholders, replace later)
   off: true  -> greyed out (feature not enabled)                    */
const LIST_SUB = [{ id: 'list', label: 'စာရင်း' }, { id: 'new', label: 'အသစ်ထည့်ရန်' }];
const VIEW_SUB = [{ id: 'view', label: 'ကြည့်ရန်' }];

const MENU = [
  { title: 'မူလစာမျက်နှာ', items: [
    { id: 'summary',  label: 'အနှစ်ချုပ်',      icon: 'grid' },
    { id: 'retail',   label: 'လက်လီအရောင်း',   icon: 'cart' },

const titleEl = document.getElementById('pageTitle');
let activeId = 'summary';

function render() {
  drawer.innerHTML = MENU.map(g => `
    <div class="group-title">${g.title}</div>
    ${g.items.map(it => `
      <button class="item ${it.off ? 'disabled' : ''} ${it.id === activeId ? 'active' : ''}"
              data-id="${it.id}" ${it.sub ? 'data-sub="1" aria-expanded="false"' : ''}>
        ${svg(it.icon)}
        <span class="label">${it.label}</span>
        ${it.sub ? `<span class="chev">${svg('chevron', 20)}</span>` : ''}
      </button>
      ${it.sub ? `<div class="sub" data-parent="${it.id}">
        ${it.sub.map(c => `<button class="item" data-id="${it.id}/${c.id}" data-label="${c.label}">
          <span class="label">${c.label}</span></button>`).join('')}
      </div>` : ''}
    `).join('')}
  `).join('');
}

function setActive(id, label) {
  activeId = id;
  titleEl.textContent = label;
  if (typeof showPage === 'function') showPage(id, label);
  drawer.querySelectorAll('.item.active').forEach(el => el.classList.remove('active'));
  const el = drawer.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (el) el.classList.add('active');
  if (window.matchMedia('(max-width: 1023px)').matches) closeMenu();
}

drawer.addEventListener('click', e => {
  const btn = e.target.closest('.item');
  if (!btn) return;
  if (btn.dataset.sub) {                       // expand / collapse
    const sub = drawer.querySelector(`.sub[data-parent="${btn.dataset.id}"]`);
    const open = sub.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open);
    return;
  }
  const label = btn.dataset.label || btn.querySelector('.label').textContent;
  setActive(btn.dataset.id, label);
});

/* ---------- Open / close ---------- */
const openMenu  = () => document.body.classList.add('menu-open');
const closeMenu = () => document.body.classList.remove('menu-open');
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('backdrop').addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ---------- Swipe: open from left edge, close by swiping left ---------- */
const DRAWER_W = () => drawer.getBoundingClientRect().width || 300;
let startX = 0, startY = 0, dx = 0, mode = null;

document.addEventListener('touchstart', e => {
  if (window.matchMedia('(min-width: 1024px)').matches) return;
  const t = e.touches[0];
  startX = t.clientX; startY = t.clientY; dx = 0; mode = null;
  const isOpen = document.body.classList.contains('menu-open');
  if (!isOpen && startX < 20) mode = 'open';
  else if (isOpen) mode = 'close';
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!mode) return;
  const t = e.touches[0];
  dx = t.clientX - startX;
  if (Math.abs(t.clientY - startY) > Math.abs(dx) && !document.body.classList.contains('dragging')) { mode = null; return; }
  document.body.classList.add('dragging');
  const w = DRAWER_W();
  const x = mode === 'open' ? Math.min(0, -w + dx) : Math.min(0, dx);
  drawer.style.transform = `translateX(${x}px)`;
  document.getElementById('backdrop').style.opacity = String(1 + x / w);
  document.getElementById('backdrop').style.pointerEvents = 'auto';
}, { passive: true });

document.addEventListener('touchend', () => {
  if (!mode) return;
  document.body.classList.remove('dragging');
  drawer.style.transform = '';
  const bd = document.getElementById('backdrop');
  bd.style.opacity = ''; bd.style.pointerEvents = '';
  if (mode === 'open' && dx > 80) openMenu();
  if (mode === 'close' && dx < -80) closeMenu();
  mode = null;
});

render();
</script>

/* ---------- Storage: IndexedDB ---------- */
const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('pos-db', 1);
      r.onupgradeneeded = () => {
        ['products', 'categories', 'units', 'meta'].forEach(n => r.result.createObjectStore(n, { keyPath: 'id' }));
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  all(n) {
    return new Promise((res, rej) => {
      const q = this.db.transaction(n).objectStore(n).getAll();
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  put(n, o) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(n, 'readwrite'); t.objectStore(n).put(o);
      t.oncomplete = () => res(o); t.onerror = () => rej(t.error);
    });
  },
  del(n, id) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(n, 'readwrite'); t.objectStore(n).delete(id);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
    });
  },
};

/* ---------- Defaults (categories & units are editable by the user) ---------- */

// group 'weight' + ratio: 1 ပိဿာ = 100 ကျပ်သား (base weight unit = ကျပ်သား)
const DEFAULT_UNITS = [
  { name: 'ခု' }, { name: 'ထုပ်' }, { name: 'အထုပ်' }, { name: 'ဘူး' }, { name: 'ဗူး' }, { name: 'ဒါဇင်' },
  { name: 'ပိဿာ', group: 'weight', ratio: 100 }, { name: 'ကျပ်သား', group: 'weight', ratio: 1 },

const S = { products: [], categories: [], units: [], seq: 0 };

async function initStore() {
  await idb.open();
  S.products   = await idb.all('products');

  S.units      = await idb.all('units');
  const meta = await idb.all('meta');

    for (const c of DEFAULT_CATEGORIES) { await idb.put('categories', c); S.categories.push(c); }
    for (const u of DEFAULT_UNITS)      { await idb.put('units', u);      S.units.push(u); }

}

function fileToThumb(file, max = 240) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

  wireInlineAdd('unit', 'units', 'u', 'ယူနစ်');
}

function wireInlineAdd(key, store, prefix, label) {
  const box = $('#' + key + 'Add'), input = $('#' + key + 'New');
  $('#' + key + 'Toggle').addEventListener('click', () => { box.hidden = !box.hidden; if (!box.hidden) input.focus(); });
  const add = async () => {
    const name = input.value.trim(); if (!name) { input.focus(); return; }
    const list = S[store];
    let item = list.find(x => norm(x.name) === norm(name));
    if (!item) {
      item = { id: uid(prefix), name, ...(store === 'units' ? { group: 'count' } : {}) };
      try { await idb.put(store, item); } catch { toast('သိမ်း၍ မရပါ'); return; }
      list.push(item);
    }
    fillSelects(); F(key).value = item.id; setErr(key, '');
    input.value = ''; box.hidden = true; toast(label + ' ထည့်ပြီးပါပြီ');
  };
  $('#' + key + 'Ok').addEventListener('click', add);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
}

function ask(text, okLabel = 'ဖျက်မည်') {
  return new Promise(res => {
    const d = $('#cdlg'); $('#cText').textContent = text; $('#cOk').textContent = okLabel;
    d.returnValue = ''; d.addEventListener('close', () => res(d.returnValue === 'ok'), { once: true });
    d.showModal();
  });
}

/* ---------- Page ---------- */
const SORTS = [
  ['code', 'ကုဒ်အလိုက်'], ['new', 'နောက်ဆုံးထည့်သည်'], ['name', 'အမည်အလိုက်'],
  ['priceAsc', 'ရောင်းစျေး နိမ့်ဆုံးမှ'], ['priceDesc', 'ရောင်းစျေး မြင့်ဆုံးမှ'],
];

function mount() {
  $('#content').innerHTML = `
<div class="pg">
  <div class="toolbar">
    <label class="search">${svg('search', 20)}<input id="q" type="search" placeholder="အမည်၊ ဘားကုဒ်၊ ကုဒ်ဖြင့် ရှာရန်" autocomplete="off"></label>
    <button class="btn" id="fbtn" aria-expanded="false">${svg('filter', 20)} စစ်ထုတ်ရန် <span class="badge" id="fbadge" hidden></span></button>
    <button class="btn primary" id="addBtn">+ ကုန်ပစ္စည်းထည့်ရန်</button>
  </div>
  <div class="filters" id="filters" hidden>
    <div class="field"><label for="fl-cat">အမျိုးအစား</label><select id="fl-cat"></select></div>
    <div class="field"><label for="fl-status">အခြေအနေ</label>
      <select id="fl-status"><option value="">အားလုံး</option><option value="on">အသုံးပြုနေသည်</option><option value="off">ရပ်ဆိုင်းထားသည်</option></select></div>
    <div class="field"><label for="fl-sort">စီစဉ်ပုံ</label>
      <select id="fl-sort">${SORTS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
    <button class="btn reset" id="flReset">ရှင်းလင်းရန်</button>
  </div>
  <div class="count" id="pcount"></div>
  <div id="plist"></div>
</div>`;

  $('#q').value = ui.q;
  fillFilterCats();
  $('#fl-status').value = ui.status; $('#fl-sort').value = ui.sort;

  $('#q').addEventListener('input', e => { ui.q = e.target.value; renderList(); });
  $('#fl-cat').addEventListener('change', e => { ui.cat = e.target.value; renderList(); });
  $('#fl-status').addEventListener('change', e => { ui.status = e.target.value; renderList(); });
  $('#fl-sort').addEventListener('change', e => { ui.sort = e.target.value; renderList(); });
  $('#flReset').addEventListener('click', () => {
    ui.cat = ''; ui.status = ''; ui.sort = 'code';
    $('#fl-cat').value = ''; $('#fl-status').value = ''; $('#fl-sort').value = 'code'; renderList();
  });
  $('#fbtn').addEventListener('click', () => {
    const f = $('#filters'); f.hidden = !f.hidden; $('#fbtn').setAttribute('aria-expanded', String(!f.hidden));
  });
  $('#addBtn').addEventListener('click', () => openForm());
  $('#plist').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset.id);
  });
  renderList();
}

function fillFilterCats() {
  $('#fl-cat').innerHTML = `<option value="">အားလုံး</option>` +
    S.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#fl-cat').value = ui.cat;
}

function filtered() {
  const q = norm(ui.q.trim());
  const a = S.products.filter(p =>
    (!ui.cat || p.categoryId === ui.cat) &&
    (!ui.status || (ui.status === 'on') === p.active) &&
    (!q || [p.name, p.nameMm, p.code, p.barcode, p.brand].some(v => norm(v).includes(q))));
  const by = {
    code: (x, y) => x.code.localeCompare(y.code, undefined, { numeric: true }),
    new: (x, y) => y.createdAt - x.createdAt,
    name: (x, y) => titleOf(x).localeCompare(titleOf(y), 'my'),
    priceAsc: (x, y) => x.sellPrice - y.sellPrice,
    priceDesc: (x, y) => y.sellPrice - x.sellPrice,
  }[ui.sort];
  return a.sort(by);
}

const cardBtns = p => [
  ['view', 'eye', 'ကြည့်ရန်', ''], ['edit', 'edit', 'ပြင်ရန်', ''],
  ['toggle', 'power', p.active ? 'ရပ်ရန်' : 'ဖွင့်ရန်', ''], ['del', 'trash', 'ဖျက်ရန်', 'del'],
].map(([a, i, l, c]) => `<button class="abtn ${c}" data-act="${a}" data-id="${p.id}">${svg(i, 20)}<span>${l}</span></button>`).join('');

const rowBtns = p => [
  ['view', 'eye', 'ကြည့်ရန်', ''], ['edit', 'edit', 'ပြင်ရန်', ''],
  ['toggle', 'power', p.active ? 'ရပ်ရန်' : 'ဖွင့်ရန်', ''], ['del', 'trash', 'ဖျက်ရန်', 'del'],
].map(([a, i, l, c]) => `<button class="ibtn ${c}" data-act="${a}" data-id="${p.id}" title="${l}" aria-label="${l}">${svg(i, 20)}</button>`).join('');

const chip = p => `<span class="chip ${p.active ? '' : 'off'}">${p.active ? 'အသုံးပြုနေသည်' : 'ရပ်ဆိုင်းထားသည်'}</span>`;

const cardHtml = p => `
<article class="pcard ${p.active ? '' : 'off'}">
  <div class="phead">${thumb(p)}
    <div><h3 class="pname">${esc(titleOf(p))}</h3>
      ${subOf(p) ? `<div class="psub">${esc(subOf(p))}</div>` : ''}<div class="psub">${esc(p.code)}</div></div></div>
  <dl class="kv">
    <div><dt>အမျိုးအစား</dt><dd>${esc(catName(p.categoryId))}</dd></div>
    <div><dt>ယူနစ်</dt><dd>${esc(unitName(p.unitId))}</dd></div>
    <div><dt>ကုန်ကျစျေး</dt><dd>${money(p.costPrice)}</dd></div>
    <div><dt>ရောင်းစျေး</dt><dd>${money(p.sellPrice)}</dd></div>
  </dl>
  <div>${chip(p)}</div>
  <div class="acts">${cardBtns(p)}</div>
</article>`;

const rowHtml = p => `
<tr class="${p.active ? '' : 'off'}">
  <td><div class="tcell">${thumb(p, 'sm')}
    <div><div class="pname">${esc(titleOf(p))}</div>
      <div class="psub">${subOf(p) ? esc(subOf(p)) + ' · ' : ''}${esc(p.code)}</div></div></div></td>
  <td>${esc(catName(p.categoryId))}</td>
  <td>${esc(unitName(p.unitId))}</td>
  <td class="num">${money(p.costPrice)}</td>
  <td class="num"><b>${money(p.sellPrice)}</b></td>
  <td class="st">${chip(p)}</td>
  <td class="ac"><div class="tact">${rowBtns(p)}</div></td>
</tr>`;

function renderList() {
  const all = S.products, rows = filtered();
  const nf = (ui.cat ? 1 : 0) + (ui.status ? 1 : 0);
  const badge = $('#fbadge'); badge.hidden = !nf; badge.textContent = nf;
  const list = $('#plist'), cnt = $('#pcount');

  if (!all.length) {
    cnt.textContent = '';
    list.innerHTML = `<div class="empty"><div class="pimg">${svg('box', 34)}</div>
      <h3>ကုန်ပစ္စည်း မရှိသေးပါ</h3><p>ပထမဆုံး ကုန်ပစ္စည်းကို ထည့်သွင်းပါ။</p>
      <div class="row"><button class="btn primary" data-act="add">+ ကုန်ပစ္စည်းထည့်ရန်</button>
      <button class="btn" data-act="sample">နမူနာဒေတာ ထည့်ရန်</button></div></div>`;
    return;
  }
  cnt.textContent = rows.length === all.length
    ? `ကုန်ပစ္စည်း ${all.length} မျိုး`
    : `ကုန်ပစ္စည်း ${rows.length} မျိုး (စုစုပေါင်း ${all.length} မျိုးအနက်)`;
  if (!rows.length) {
    list.innerHTML = `<div class="empty"><h3>မတွေ့ပါ</h3><p>ရှာဖွေမှု သို့မဟုတ် စစ်ထုတ်မှုနှင့် ကိုက်ညီသော ကုန်ပစ္စည်း မရှိပါ။</p></div>`;
    return;
  }
  list.innerHTML = `
  <div class="cards">${rows.map(cardHtml).join('')}</div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>ကုန်ပစ္စည်း</th><th>အမျိုးအစား</th><th>ယူနစ်</th>
      <th class="num">ကုန်ကျစျေး</th><th class="num">ရောင်းစျေး</th><th>အခြေအနေ</th><th></th></tr></thead>
    <tbody>${rows.map(rowHtml).join('')}</tbody></table></div>`;
}

/* ---------- Actions ---------- */
async function act(a, id) {
  if (a === 'add') return openForm();
  if (a === 'sample') return seedSample();
  if (a === 'view') return openView(id);
  if (a === 'edit') return openForm(id);
  const p = find(id); if (!p) return;
  if (a === 'toggle') {
    const n = { ...p, active: !p.active, updatedAt: Date.now() };
    try { await idb.put('products', n); } catch { return toast('သိမ်း၍ မရပါ'); }
    S.products[S.products.indexOf(p)] = n; renderList();
    toast(n.active ? 'ဖွင့်ပြီးပါပြီ' : 'ရပ်ဆိုင်းပြီးပါပြီ');
  }
  if (a === 'del') {
    if (!await ask(`"${titleOf(p)}" ကို ဖျက်မလား? ပြန်ယူ၍ မရနိုင်ပါ။`)) return;
    try { await idb.del('products', p.id); } catch { return toast('ဖျက်၍ မရပါ'); }
    S.products.splice(S.products.indexOf(p), 1); renderList(); toast('ဖျက်ပြီးပါပြီ');
  }
}

async function nextCode() {
  let code;
  do { S.seq++; code = 'P-' + String(S.seq).padStart(4, '0'); } while (S.products.some(p => p.code === code));
  await idb.put('meta', { id: 'seq', value: S.seq });
  return code;
}

async function seedSample() {
  const cat = n => (S.categories.find(c => c.name === n) || {}).id;
  const unit = n => (S.units.find(u => u.name === n) || {}).id;
  const rows = [
    ['Baby Diaper', 'ကလေးဒိုင်ပါ', 'ကလေးသုံးပစ္စည်း', 'အထုပ်', 10500, 12000],
    ['Baby bit', 'ကလေးအားဆေး', 'ကလေးသုံးပစ္စည်း', 'ထုပ်', 500, 600],
    ['', 'ငါးခြောက်', 'အစားအသောက်', 'ပိဿာ', 9000, 11000],
  ];
  for (const [name, nameMm, c, u, cost, sell] of rows) {
    const now = Date.now();
    const p = { id: uid('p'), createdAt: now, updatedAt: now, code: await nextCode(),
      name: name || nameMm, nameMm: name ? nameMm : '', barcode: '', brand: '', description: '',
      categoryId: cat(c), unitId: unit(u), costPrice: cost, sellPrice: sell, image: null, active: true };
    await idb.put('products', p); S.products.push(p);
  }
  renderList(); toast('နမူနာဒေတာ ထည့်ပြီးပါပြီ');
}

/* ---------- Add / edit form ---------- */
function fillSelects() {
  const c = F('cat').value, u = F('unit').value;
  F('cat').innerHTML = `<option value="">အမျိုးအစား ရွေးပါ</option>` + S.categories.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  F('unit').innerHTML = `<option value="">ယူနစ် ရွေးပါ</option>` + S.units.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  F('cat').value = c; F('unit').value = u;
  fillFilterCatsSafe();
}
function fillFilterCatsSafe() { if ($('#fl-cat')) fillFilterCats(); }

function setErr(key, msg) {
  const w = $('#w-' + key); if (!w) return;
  w.classList.toggle('err', !!msg); const m = w.querySelector('.msg'); if (m) m.textContent = msg || '';
}
function renderImgPrev() {
  $('#imgPrev').innerHTML = pendingImage ? `<img src="${pendingImage}" alt="">` : svg('box', 44);
  $('#imgClear').hidden = !pendingImage;
}
function updateHint() {
  const c = parsePrice(F('cost').value), s = parsePrice(F('sell').value), h = $('#mHint');
  h.className = 'hint full'; h.textContent = '';
  if (c === null || s === null) return;
  const m = s - c;
  if (m < 0) { h.classList.add('warn'); h.textContent = `ရောင်းစျေးက ကုန်ကျစျေးထက် နိမ့်နေသည် (${money(-m)} ဆုံးရှုံး)`; }
  else h.textContent = `အမြတ် ${money(m)}` + (c > 0 ? ` (ကုန်ကျစျေးအပေါ် ${Math.round(m / c * 100)}%)` : '');
}

function openForm(id) {
  editing = id ? find(id) : null;
  const p = editing || {};
  $('#pform').reset();
  ['name', 'nameMm', 'code', 'barcode', 'cat', 'unit', 'cost', 'sell'].forEach(k => setErr(k, ''));
  $('#pTitle').textContent = editing ? 'ကုန်ပစ္စည်း ပြင်ရန်' : 'ကုန်ပစ္စည်း အသစ်ထည့်ရန်';
  F('cat').value = ''; F('unit').value = ''; fillSelects();
  F('name').value = p.name || ''; F('nameMm').value = p.nameMm || '';
  F('code').value = p.code || ''; F('code').placeholder = editing ? '' : 'အလိုအလျောက်';
  F('barcode').value = p.barcode || ''; F('brand').value = p.brand || ''; F('desc').value = p.description || '';
  F('cat').value = p.categoryId || ''; F('unit').value = p.unitId || '';
  F('cost').value = p.costPrice ?? ''; F('sell').value = p.sellPrice ?? '';
  F('active').checked = editing ? p.active : true;
  $('#catAdd').hidden = true; $('#unitAdd').hidden = true;
  pendingImage = p.image || null; renderImgPrev(); updateHint();
  $('#pdlg').showModal(); $('#pdlg .db').scrollTop = 0; F('name').focus();
}

async function submitForm(e) {
  e.preventDefault();
  const v = {
    name: F('name').value.trim(), nameMm: F('nameMm').value.trim(), code: F('code').value.trim(),
    barcode: F('barcode').value.trim(), brand: F('brand').value.trim(), description: F('desc').value.trim(),
    categoryId: F('cat').value, unitId: F('unit').value, active: F('active').checked,
  };
  const cost = parsePrice(F('cost').value), sell = parsePrice(F('sell').value);
  const others = S.products.filter(p => !editing || p.id !== editing.id);
  const errs = {};
  if (!v.name) errs.name = 'ကုန်ပစ္စည်းအမည် ထည့်ပါ';
  if (!v.categoryId) errs.cat = 'အမျိုးအစား ရွေးပါ';
  if (!v.unitId) errs.unit = 'ယူနစ် ရွေးပါ';
  if (cost === null) errs.cost = 'ကုန်ကျစျေး ထည့်ပါ (0 သို့မဟုတ် ပိုများရမည်)';
  if (sell === null) errs.sell = 'ရောင်းစျေး ထည့်ပါ (0 သို့မဟုတ် ပိုများရမည်)';
  if (v.code && others.some(p => norm(p.code) === norm(v.code))) errs.code = 'ဤကုဒ်ကို အသုံးပြုပြီးသား ဖြစ်သည်';
  if (v.barcode && others.some(p => p.barcode && norm(p.barcode) === norm(v.barcode))) errs.barcode = 'ဤဘားကုဒ်ကို အသုံးပြုပြီးသား ဖြစ်သည်';
  ['name', 'code', 'barcode', 'cat', 'unit', 'cost', 'sell'].forEach(k => setErr(k, errs[k]));
  const first = Object.keys(errs)[0];
  if (first) { const el = F(first); if (el) el.focus(); return; }

  const btn = $('#saveBtn'); btn.disabled = true;
  try {
    const now = Date.now();
    const p = editing ? { ...editing } : { id: uid('p'), createdAt: now };
    Object.assign(p, {
      code: v.code || (editing ? editing.code : await nextCode()),
      name: v.name, nameMm: v.nameMm, barcode: v.barcode, brand: v.brand, description: v.description,
      categoryId: v.categoryId, unitId: v.unitId, active: v.active,
      costPrice: cost, sellPrice: sell, image: pendingImage, updatedAt: now,
    });
    await idb.put('products', p);
    if (editing) S.products[S.products.indexOf(editing)] = p; else S.products.push(p);
    $('#pdlg').close(); renderList(); toast('သိမ်းပြီးပါပြီ');
  } catch (err) {
    console.error(err); toast('သိမ်း၍ မရပါ');
  } finally { btn.disabled = false; }
}

/* ---------- Detail view ---------- */
function openView(id) {
  const p = find(id); if (!p) return; viewId = id;
  const m = p.sellPrice - p.costPrice;
  $('#vBody').innerHTML = `
    <div class="detail-top">${thumb(p, 'lg')}
      <div><h3 class="pname">${esc(titleOf(p))}</h3>
        ${subOf(p) ? `<div class="psub">${esc(subOf(p))}</div>` : ''}
        <div class="psub">${esc(p.code)}</div><div style="margin-top:6px">${chip(p)}</div></div></div>
    <dl class="kv" style="margin-top:16px">
      <div><dt>အမျိုးအစား</dt><dd>${esc(catName(p.categoryId))}</dd></div>
      <div><dt>ယူနစ်</dt><dd>${esc(unitName(p.unitId))}</dd></div>
      <div><dt>ကုန်ကျစျေး</dt><dd>${money(p.costPrice)}</dd></div>
      <div><dt>ရောင်းစျေး</dt><dd>${money(p.sellPrice)}</dd></div>
      <div><dt>အမြတ်</dt><dd style="${m < 0 ? 'color:var(--danger)' : ''}">${m < 0 ? '-' : ''}${money(Math.abs(m))}</dd></div>
      <div><dt>ဘားကုဒ်</dt><dd>${esc(p.barcode || '-')}</dd></div>
      <div><dt>ကုန်အမှတ်တံဆိပ်</dt><dd>${esc(p.brand || '-')}</dd></div>
    </dl>
    ${p.description ? `<div class="detail-desc">${esc(p.description)}</div>` : ''}`;
  $('#vdlg').showModal();
}

/* ---------- Routing hook (called from setActive) ---------- */
window.showPage = async function (id) {
  const content = $('#content');
  if (id !== 'products/list' && id !== 'products/new') {
    content.innerHTML = '<p>ဒီနေရာမှာ စာမျက်နှာ အကြောင်းအရာ ထည့်ပါမယ်။</p>';
    return;
  }
  titleEl.textContent = 'ကုန်ပစ္စည်း';
  await ready;
  if (storeError) {
    content.innerHTML = `<div class="empty"><h3>ဒေတာသိမ်းစနစ် မဖွင့်နိုင်ပါ</h3>
      <p>Chrome သို့မဟုတ် Edge ဖြင့် ဖွင့်ပါ။ (Private/Incognito mode တွင် အလုပ်မလုပ်နိုင်ပါ)</p></div>`;
    return;
  }
  ensureDialogs(); mount();
  if (id === 'products/new') openForm();
};

// "/" focuses the search box (desktop shortcut)
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  const q = $('#q'); if (q && !document.querySelector('dialog[open]')) { e.preventDefault(); q.focus(); }
});
})();
