<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #7c3aed;
    --accent-soft: #ede9fe;
    --ink: #1f2937;
    --muted: #9ca3af;
    --line: #e5e7eb;
    --surface: #ffffff;
    --page: #f3f4f8;
    --drawer-w: min(320px, 86vw);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #a78bfa;
      --accent-soft: #2e2457;
      --ink: #e5e7eb;
      --muted: #6b7280;
      --line: #2b2f3a;
      --surface: #171a22;
      --page: #0f1117;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans Myanmar", "Padauk", system-ui, sans-serif;
    background: var(--page);
    color: var(--ink);
    line-height: 1.6;
    overflow: hidden;
  }

  /* ---------- Top bar + main ---------- */
  .app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: calc(var(--safe-top) + 8px) 12px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 12px;
    background: transparent; color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--accent-soft); }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  main { flex: 1; overflow: auto; padding: 20px; }
  main p { color: var(--muted); margin: 4px 0 0; }

  /* ---------- Drawer ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(15, 17, 23, .5);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 40;
  }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: var(--drawer-w);
    background: var(--surface);
    transform: translateX(-100%);
    transition: transform .28s cubic-bezier(.3, .8, .3, 1);
    z-index: 50;
    overflow-y: auto; overscroll-behavior: contain;
    padding: calc(var(--safe-top) + 12px) 0 calc(var(--safe-bottom) + 24px);
    box-shadow: 4px 0 24px rgba(0, 0, 0, .15);
  }
  body.menu-open .drawer { transform: none; }
  body.menu-open .backdrop { opacity: 1; pointer-events: auto; }
  body.dragging .drawer, body.dragging .backdrop { transition: none; }

  .group-title {
    margin: 18px 20px 6px; font-size: 14px; font-weight: 700; color: var(--ink);
  }
  .group-title:first-child { margin-top: 8px; }

  .item {
    display: flex; align-items: center; gap: 16px;
    width: calc(100% - 24px); margin: 0 12px;
    min-height: 48px; padding: 0 12px;
    border: 0; border-radius: 12px; background: transparent;
    font: inherit; font-size: 16px; color: var(--ink); text-align: left;
    cursor: pointer;
  }
  .item:active { background: var(--accent-soft); }
  .item svg { flex: none; }
  .item .label { flex: 1; }
  .item .chev { transition: transform .2s; color: var(--ink); }
  .item.open .chev { transform: rotate(180deg); }
  .item.active { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
  .item.disabled { color: var(--muted); }
  .item.disabled .chev { color: var(--muted); }

  .sub { display: none; margin: 0 12px 4px 56px; border-left: 2px solid var(--line); }
  .sub.open { display: block; }
  .sub .item { width: 100%; margin: 0; min-height: 42px; font-size: 15px; padding-left: 16px; }

  /* Wide screens (iPad landscape): menu stays visible */
  @media (min-width: 1024px) {
    .drawer { transform: none; box-shadow: none; border-right: 1px solid var(--line); }
    .backdrop { display: none; }
    .app { margin-left: var(--drawer-w); }
    #menuBtn { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .backdrop, .item .chev { transition: none; }
  }

  /* =====================================================
     ကုန်ပစ္စည်း (Products) page
     ===================================================== */
  :root {
    --on-accent: #ffffff;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --on-accent: #1b1033;
      --danger: #f87171;
      --danger-soft: #3b1c1c;
      --warn: #fbbf24;
    }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pg { max-width: 1240px; margin: 0 auto; }

  /* Buttons */
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap;
  }
  .btn:active { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:active { filter: brightness(.92); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .btn.small { min-height: 40px; padding: 0 14px; }
  @media (hover: hover) {
    .btn:hover { border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.06); }
  }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700;
    display: inline-grid; place-items: center;
  }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .search {
    flex: 1 1 100%; display: flex; align-items: center; gap: 10px;
    min-height: 46px; padding: 0 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  }
  .search:focus-within { border-color: var(--accent); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 15px; color: var(--ink); height: 44px;
  }
  .toolbar .btn { flex: 1 1 0; }
  @media (min-width: 700px) {
    .search { flex: 1 1 320px; }
    .toolbar .btn { flex: 0 0 auto; }
  }
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
    margin-top: 12px; padding: 14px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .filters[hidden] { display: none; }
  .filters .reset { align-self: end; }
  .count { margin: 14px 2px 10px; font-size: 14px; color: var(--muted); }

  /* Form controls */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .flabel { font-size: 14px; font-weight: 500; }
  .field .req { color: var(--danger); margin-left: 3px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea, .addrow input {
    width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px;
  }
  .field textarea { min-height: 96px; padding: 10px 14px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus, .addrow input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field .help { font-size: 13px; color: var(--muted); }
  .field .msg { font-size: 13px; color: var(--danger); display: none; }
  .field.err input, .field.err select { border-color: var(--danger); }
  .field.err .msg { display: block; }
  .linkbtn {
    align-self: flex-start; border: 0; background: none; padding: 4px 0; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: underline;
  }
  .addrow { display: flex; gap: 8px; }
  .addrow[hidden] { display: none; }
  .addrow input { flex: 1; }
  .check { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

  /* Product visual */
  .pimg {
    width: 76px; height: 76px; flex: none; border-radius: 16px; overflow: hidden;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--line); display: grid; place-items: center;
  }
  .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pimg.sm { width: 48px; height: 48px; border-radius: 12px; }
  .pimg.lg { width: 112px; height: 112px; border-radius: 20px; }

  /* Narrow screens: cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .pcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .pcard.off { background: var(--page); }
  .phead { display: flex; gap: 14px; align-items: center; }
  .pname { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; }
  .psub { font-size: 14px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
  .kv dt { font-size: 13px; color: var(--muted); }
  .kv dd { margin: 0; font-size: 16px; font-weight: 600; }
  .chip {
    display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: var(--accent-soft); color: var(--accent);
  }
  .chip.off { background: var(--line); color: var(--muted); }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .abtn {
    min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .abtn:active { background: var(--accent-soft); }
  .abtn.del { color: var(--danger); }

  /* Wide screens (Windows): table */
  .tbl-wrap { display: none; }
  @media (min-width: 900px) {
    .cards { display: none; }
    .tbl-wrap { display: block; }
  }
  .tbl {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .tbl th {
    text-align: left; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 12px 14px; background: var(--page); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .tbl td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
  .tbl tbody tr:first-child td { border-top: 0; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl tr.off td:not(.st):not(.ac) > * { opacity: .55; }
  .tcell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .tcell .pname { font-size: 16px; }
  .tcell .psub { font-size: 13px; }
  .tact { display: flex; gap: 6px; justify-content: flex-end; }
  .ibtn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  .ibtn:active, .ibtn:hover { background: var(--accent-soft); }
  .ibtn.del { color: var(--danger); }
  .ibtn.del:hover { background: var(--danger-soft); }
  @media (hover: hover) { .tbl tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); } }

  /* Empty state */
  .empty {
    text-align: center; padding: 56px 20px; border-radius: 18px;
    border: 1px dashed var(--line); background: var(--surface);
  }
  .empty .pimg { margin: 0 auto 14px; width: 72px; height: 72px; }
  .empty h3 { margin: 0 0 6px; font-size: 18px; }
  .empty p { margin: 0 0 18px; color: var(--muted); }
  .empty .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Dialogs */
  dialog.dlg {
    padding: 0; border: 0; border-radius: 20px; color: var(--ink); background: var(--surface);
    width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
  }
  dialog.dlg.narrow { width: min(420px, calc(100vw - 32px)); }
  dialog.dlg[open] { display: flex; flex-direction: column; }
  dialog.dlg::backdrop { background: rgba(15, 17, 23, .55); }
  .dh {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px 10px 22px; border-bottom: 1px solid var(--line); flex: none;
  }
  .dh h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .db { padding: 6px 22px 20px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  .df {
    display: flex; gap: 10px; padding: 12px 22px calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--line); flex: none;
  }
  .df .btn { flex: 1; }
  @media (min-width: 640px) { .df { justify-content: flex-end; } .df .btn { flex: 0 0 auto; min-width: 140px; } }
  @media (max-width: 639px) {
    dialog.dlg:not(.narrow) {
      width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0;
    }
  }
  .sec {
    margin: 22px 0 14px; padding-bottom: 8px; font-size: 16px; font-weight: 700; color: var(--accent);
    border-bottom: 2px solid var(--accent-soft);
  }
  .sec:first-child { margin-top: 14px; }
  .fg { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .fg { grid-template-columns: 1fr 1fr; } .fg .full { grid-column: 1 / -1; } }
  .imgrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hint { font-size: 13px; color: var(--muted); min-height: 20px; }
  .hint.warn { color: var(--warn); }
  .detail-top { display: flex; gap: 16px; align-items: center; margin: 16px 0 8px; }
  .detail-top .pname { font-size: 20px; }
  .detail-desc { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--page); white-space: pre-wrap; }
  .confirm-text { margin: 20px 0 6px; font-size: 16px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 12px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* =====================================================
     ဝယ်ယူမှု (Purchase) page
     ===================================================== */
  .field input[type=date] {
    width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px;
  }
  .field input[type=date]:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pickres { margin-top: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .pickres[hidden] { display: none; }
  .pick {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px;
    border: 0; border-top: 1px solid var(--line); background: transparent;
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  }
  .pick:first-child { border-top: 0; }
  .pick:active, .pick:hover { background: var(--accent-soft); }
  .irow { border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 10px; background: var(--surface); }
  .ihead { display: flex; align-items: center; gap: 12px; }
  .ihead .iname { flex: 1; min-width: 0; }
  .igrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .igrid .field:last-child { grid-column: 1 / -1; }
  @media (min-width: 640px) { .igrid { grid-template-columns: 1fr 1fr 1fr; } .igrid .field:last-child { grid-column: auto; } }
  .ltotal { min-height: 46px; display: flex; align-items: center; font-weight: 600; font-size: 16px; }
  .tot { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--page); display: grid; gap: 6px; }
  .tot > div { display: flex; justify-content: space-between; gap: 12px; }
  .tot .grand { font-size: 18px; font-weight: 700; }
  .vrow { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .due { color: var(--danger); font-weight: 600; }
  .chip.debt { background: var(--danger-soft); color: var(--danger); }

  /* =====================================================
     အနှစ်ချုပ် (Summary) page
     ===================================================== */
  .sm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 700px) { .sm-grid { grid-template-columns: repeat(4, 1fr); } }
  .sm-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
    display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .sm-card .l { font-size: 13px; color: var(--muted); }
  .sm-card .v { font-size: 20px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .sm-card .s { font-size: 13px; color: var(--muted); }
  .sm-card.hl { background: var(--accent-soft); border-color: transparent; }
  .sm-card.hl .v { color: var(--accent); }
  .sm-card.warn .v { color: var(--danger); }
  .sm-h { margin: 22px 2px 10px; font-size: 16px; font-weight: 700; }
  .sm-cols { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 900px) { .sm-cols { grid-template-columns: 1fr 1fr; } }
  .sm-list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .sm-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .sm-row:first-child { border-top: 0; }
  .sm-row .n { min-width: 0; }
  .sm-row .n b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .sm-row .n span { font-size: 13px; color: var(--muted); }
  .sm-row .a { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sm-empty { padding: 22px 14px; text-align: center; color: var(--muted); }
  .sm-quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .sm-quick a {
    min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .sm-quick a.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
</style>
</head>
<body data-page="summary" data-title="အနှစ်ချုပ်">

<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="မီနူး ဖွင့်ရန်">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 id="pageTitle">အနှစ်ချုပ်</h1>
  </header>
  <main id="content"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<nav class="drawer" id="drawer" aria-label="အဓိက မီနူး"></nav>

<script>
/* ---------- Icons (24x24, stroke) ---------- */
const ICONS = {
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  cart: '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.7 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 7H6"/>',
  truck: '<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  userPlus: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>',

function setActive(id, label) {

drawer.addEventListener('click', e => {

  if (!btn) return;
  if (btn.dataset.sub) {                       // expand / collapse
    const sub = drawer.querySelector(`.sub[data-parent="${btn.dataset.id}"]`);
    const open = sub.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open);
    return;
  }
  const label = btn.dataset.label || btn.querySelector('.label').textContent;
  go(btn.dataset.id, label);
});

  'products/list': 'products.html', 'products/new': 'products.html?new=1',
  'purchase/list': 'purchase.html', 'purchase/new': 'purchase.html?new=1',

};
function go(id, label) {
  const target = ROUTES[id] || 'index.html?p=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(label);
  const here = location.pathname.split('/').pop() || 'index.html';
  if (target.split('?')[0] === here) setActive(id, label);   // same page: no reload
  else location.href = target;
}

/* default page body (pages that have a real module overwrite showPage) */

};

/* ---------- Open / close ---------- */

const closeMenu = () => document.body.classList.remove('menu-open');
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('backdrop').addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ---------- Swipe: open from left edge, close by swiping left ---------- */
const DRAWER_W = () => drawer.getBoundingClientRect().width || 300;
let startX = 0, startY = 0, dx = 0, mode = null;

document.addEventListener('touchstart', e => {
  if (window.matchMedia('(min-width: 1024px)').matches) return;
  const t = e.touches[0];
  startX = t.clientX; startY = t.clientY; dx = 0; mode = null;
  const isOpen = document.body.classList.contains('menu-open');
  if (!isOpen && startX < 20) mode = 'open';
  else if (isOpen) mode = 'close';
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!mode) return;
  const t = e.touches[0];
  dx = t.clientX - startX;
  if (Math.abs(t.clientY - startY) > Math.abs(dx) && !document.body.classList.contains('dragging')) { mode = null; return; }
  document.body.classList.add('dragging');
  const w = DRAWER_W();
  const x = mode === 'open' ? Math.min(0, -w + dx) : Math.min(0, dx);
  drawer.style.transform = `translateX(${x}px)`;
  document.getElementById('backdrop').style.opacity = String(1 + x / w);
  document.getElementById('backdrop').style.pointerEvents = 'auto';
}, { passive: true });

document.addEventListener('touchend', () => {
  if (!mode) return;
  document.body.classList.remove('dragging');
  drawer.style.transform = '';
  const bd = document.getElementById('backdrop');
  bd.style.opacity = ''; bd.style.pointerEvents = '';
  if (mode === 'open' && dx > 80) openMenu();
  if (mode === 'close' && dx < -80) closeMenu();
  mode = null;
});

render();

<script>
/* ---------- အနှစ်ချုပ် (Summary): read-only view over the shared pos-db ---------- */
(() => {
  const DAY = 86400000;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => Math.round(Number(n) || 0).toLocaleString('en-US') + ' ကျပ်';
  const qty = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });

  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('pos-db', 5);
      r.onupgradeneeded = () => {            // same stores as the other pages, in case this page opens first
        ['products', 'categories', 'units', 'meta', 'purchases', 'sales', 'expenses', 'adjustments', 'customers', 'suppliers'].forEach(n => {
          if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' });
        });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  const all = (db, n) => new Promise((res, rej) => {
    const q = db.transaction(n).objectStore(n).getAll();
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });

  const card = (l, v, s = '', cls = '') =>
    `<div class="sm-card ${cls}"><span class="l">${l}</span><span class="v">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;

  const profitOf = sale => sale.total - sale.items.reduce((a, it) => a + (it.cost || 0) * it.qty, 0);
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  async function renderSummary() {
    const box = document.getElementById('content');
    box.innerHTML = '<div class="pg"><p>ဖတ်နေသည်…</p></div>';
    let products, sales, purchases, expenses;
    try {
      const db = await openDB();
      [products, sales, purchases, expenses] = await Promise.all([all(db, 'products'), all(db, 'sales'), all(db, 'purchases'), all(db, 'expenses')]);
    } catch (e) {
      console.error(e);
      box.innerHTML = '<div class="pg"><div class="sm-list"><div class="sm-empty">ဒေတာ ဖတ်၍ မရပါ</div></div></div>';
      return;
    }

    const now = new Date();
    const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const m0 = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const todayStr = ymd(now), monthStr = todayStr.slice(0, 7);

    const sToday = sales.filter(s => s.createdAt >= t0 && s.createdAt < t0 + DAY);
    const sMonth = sales.filter(s => s.createdAt >= m0);
    const pMonth = purchases.filter(p => (p.date || '').startsWith(monthStr));
    const eMonth = expenses.filter(e => (e.date || '').startsWith(monthStr));
    const expMonth = eMonth.reduce((a, e) => a + (e.amount || 0), 0);
    const profitMonth = sMonth.reduce((a, s) => a + profitOf(s), 0);
    const sum = (a, f) => a.reduce((x, o) => x + f(o), 0);
    const chg = s => Number(s.deliveryCharge) || 0;
    const delIncMonth = sum(sMonth, s => (s.delivery && s.delivery.mode === 'own') ? chg(s) : 0);   // own-delivery charge = shop income
    const netMonth = profitMonth + delIncMonth - expMonth;

    // customer credit still to collect
    const saleDue = s => s.credit ? Math.max(0, s.total + chg(s) - (s.paid || 0)) : 0;
    const recv = sum(sales, saleDue), recvSales = sales.filter(s => saleDue(s) > 0);
    const byCust = new Map();
    recvSales.forEach(s => { const k = s.customerName || 'ဖောက်သည် မသတ်မှတ်'; byCust.set(k, (byCust.get(k) || 0) + saleDue(s)); });
    const recvList = [...byCust.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);

    // delivery
    const dls = sales.filter(s => s.delivery);
    const dPend = dls.filter(s => s.delivery.status === 'pending').length;
    const codOpen = dls.filter(s => s.delivery.cod && s.delivery.status !== 'settled');
    const codSum = sum(codOpen, s => s.delivery.mode === 'company' ? s.total : s.total + chg(s));
    const coOwed = sum(dls, s => (s.delivery.mode === 'company' && !s.delivery.cod && chg(s) > 0 && !s.delivery.companyPaid) ? chg(s) : 0);

    const active = products.filter(p => p.active !== false);
    const outOf = active.filter(p => !(p.stock > 0));
    const stockValue = sum(active, p => Math.max(0, p.stock || 0) * (p.costPrice || 0));
    const debt = sum(purchases, p => Math.max(0, p.total - p.paid));
    const debtN = purchases.filter(p => p.total > p.paid).length;

    // best sellers this month (by quantity)
    const byP = new Map();
    sMonth.forEach(s => s.items.forEach(it => {
      const o = byP.get(it.productId) || { name: it.name, unit: it.unit, qty: 0, amt: 0 };
      o.qty += it.qty; o.amt += it.qty * it.price; byP.set(it.productId, o);
    }));
    const top = [...byP.values()].sort((a, b) => b.qty - a.qty).slice(0, 5);
    const recent = [...sales].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);
    const isLow = p => Number(p.minStock) > 0 && !(p.stock > Number(p.minStock));
    // ရက်ကုန်ခါနီး / ကုန်ပြီး (လက်ကျန်ရှိသော ပစ္စည်းများ)
    const daysLeft = p => { const [y, m, d] = String(p.expiryDate).split('-').map(Number);
      return Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / DAY); };
    const expAll = active.filter(p => p.expiryDate && p.stock > 0).map(p => ({ p, d: daysLeft(p) }))
      .filter(x => !Number.isNaN(x.d) && x.d <= (Number(x.p.expiryWarnDays) > 0 ? Number(x.p.expiryWarnDays) : 30)).sort((a, b) => a.d - b.d);
    const expiredN = expAll.filter(x => x.d < 0).length;
    const lowN = active.filter(isLow).length;
    const outList = active.filter(p => !(p.stock > 0) || isLow(p)).sort((a, b) => (a.stock || 0) - (b.stock || 0)).slice(0, 10);

    const hm = t => { const d = new Date(t); return `${d.getDate()}/${d.getMonth() + 1} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const rows = (arr, f, empty) => arr.length ? arr.map(f).join('') : `<div class="sm-empty">${empty}</div>`;

    box.innerHTML = `<div class="pg">
      <div class="sm-quick">
        <a class="primary" href="retail.html">လက်လီအရောင်း</a>
        <a href="purchase.html?new=1">ဝယ်ယူမှု အသစ်</a>
        <a href="delivery.html">Delivery စာရင်း</a>
      </div>

      <h2 class="sm-h">ယနေ့</h2>
      <div class="sm-grid">
        ${card('ရောင်းရငွေ', money(sum(sToday, s => s.total)), `${sToday.length} ကြိမ်`, 'hl')}
        ${card('အမြတ်', money(sum(sToday, profitOf)), 'ကုန်ကျစျေးနုတ်ပြီး')}
        ${card('လျှော့စျေး', money(sum(sToday, s => s.discount || 0)))}
        ${card('ရောင်းရသော ပစ္စည်း', qty(sum(sToday, s => sum(s.items, i => i.qty))), 'စုစုပေါင်း အရေအတွက်')}
      </div>

      <h2 class="sm-h">ယခုလ</h2>
      <div class="sm-grid">
        ${card('ရောင်းရငွေ', money(sum(sMonth, s => s.total)), `${sMonth.length} ကြိမ်`)}

<script>
/* ---------- Barcode scanner support ----------
   Bluetooth / USB scanners pair as a keyboard: they "type" the code very fast and press Enter.
   A burst of >= 4 characters, each < 70 ms apart, ending in Enter is treated as a scan. */
(() => {
  const DEF = { scanEnabled: true, scanBeep: true };
  const MIN_LEN = 4, GAP = 70;
  let cfg = { ...DEF }, handler = null, ctx = null;
  let buf = '', last = 0, t0 = 0, el0 = null, val0 = '';

  function loadCfg() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('pos-db', 5);
        r.onupgradeneeded = () => {
          ['products', 'categories', 'units', 'meta', 'purchases', 'sales', 'expenses', 'adjustments', 'customers', 'suppliers'].forEach(n => {
            if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' });
          });
        };
        r.onsuccess = () => {
          const db = r.result;
          try {
            const q = db.transaction('meta').objectStore('meta').get('settings');
            q.onsuccess = () => { cfg = { ...DEF, ...((q.result && q.result.value) || {}) }; db.close(); res(); };
            q.onerror = () => { db.close(); res(); };
          } catch (e) { db.close(); res(); }
        };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  }

  function beep(ok) {
    if (!cfg.scanBeep) return;
    try {
      const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
      ctx = ctx || new A(); if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = ok ? 1200 : 280; g.gain.value = 0.08;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + (ok ? 0.08 : 0.25));
    } catch (e) { /* no sound */ }
  }

  const editable = e => e && (e.tagName === 'INPUT' || e.tagName === 'TEXTAREA') && typeof e.value === 'string' &&
    !['checkbox', 'radio', 'button', 'file', 'submit'].includes(e.type);
  const reset = () => { buf = ''; last = 0; el0 = null; val0 = ''; };

  function onKey(e) {
    if (!handler || !cfg.scanEnabled) return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    const now = performance.now();
    if (e.key === 'Enter') {
      const isScan = buf.length >= MIN_LEN && now - last <= GAP * 2;
      if (!isScan) { reset(); return; }
      const code = buf, ms = Math.round(now - t0), a = el0, v = val0;
      reset();
      e.preventDefault(); e.stopImmediatePropagation();
      if (editable(a)) { a.value = v; a.dispatchEvent(new Event('input', { bubbles: true })); }   // undo the typed digits
      const res = handler(code, { len: code.length, ms });
      if (res !== false) beep(res !== 'miss');
      return;
    }
    if (!e.key || e.key.length !== 1) return;
    if (now - last > GAP) { buf = ''; t0 = now; el0 = document.activeElement; val0 = editable(el0) ? el0.value : ''; }
    buf += e.key; last = now;
  }
  document.addEventListener('keydown', onKey, true);

  window.POSScan = {
    start(fn) { handler = fn; return loadCfg(); },   // fn(code, {len, ms}) -> 'ok' | 'miss' | false (not handled)
    stop() { handler = null; reset(); },
    reload: loadCfg,
    beep,
  };
})();
</script>
<script>
/* ---------- ပရင့်ဆက်တင် (Print settings page) ---------- */
(() => {
  const DEF = { scanEnabled: true, scanBeep: true, paper: 58, shopName: '', shopAddr: '', shopPhone: '',

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('pos-db', 5);
      r.onupgradeneeded = () => {
        ['products', 'categories', 'units', 'meta', 'purchases', 'sales', 'expenses', 'adjustments', 'customers', 'suppliers'].forEach(n => {
          if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' });
        });
      };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function loadSettings() {
    const db = await openDB();
    try {
      return await new Promise((res, rej) => {
        const q = db.transaction('meta').objectStore('meta').get('settings');
        q.onsuccess = () => res({ ...DEF, ...((q.result && q.result.value) || {}) }); q.onerror = () => rej(q.error);
      });
    } finally { db.close(); }
  }
  async function saveSettings(v) {
    const db = await openDB();
    try {
      await new Promise((res, rej) => {
        const t = db.transaction('meta', 'readwrite'); t.objectStore('meta').put({ id: 'settings', value: v });
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    } finally { db.close(); }
  }

  let tt;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200);
  }

  async function renderSettings() {
    const box = document.getElementById('content');
    let v;
    try { v = await loadSettings(); }
    catch (e) { console.error(e); box.innerHTML = '<div class="pg"><div class="sm-list"><div class="sm-empty">ဒေတာ ဖတ်၍ မရပါ</div></div></div>'; return; }

    box.innerHTML = `<div class="pg" style="max-width:720px">
      <h2 class="sm-h" style="margin-top:4px">ဘားကုဒ် စကင်နာ</h2>

        <label class="check"><input type="checkbox" id="st-beep" ${v.scanBeep ? 'checked' : ''}><span>စကင်ဖတ်တိုင်း အသံပေးမည်</span></label>
        <p style="margin:0; font-size:14px">စကင်နာကို ဖုန်း/ကွန်ပျူတာ၏ Bluetooth ဆက်တင်တွင် keyboard (HID) အဖြစ် pair လုပ်ပါ။ ဖတ်ပြီးတိုင်း Enter ပို့သော ပုံမှန်ဆက်တင်ဖြစ်ရမည်။ လက်လီအရောင်းတွင် ဖတ်လျှင် ပစ္စည်း cart ထဲ ဝင်မည်၊ ကုန်ပစ္စည်းစာမျက်နှာတွင် ဘားကုဒ်ကွက်ထဲ ဝင်မည်။</p>
        <div class="sm-card hl" id="st-test" aria-live="polite">
          <span class="l">စမ်းသပ်ရန်</span>
          <span class="v" id="st-res">ဘားကုဒ်တစ်ခု ဖတ်ကြည့်ပါ</span>
          <span class="s" id="st-info">ဤစာမျက်နှာပေါ်တွင် စကင်နာဖြင့် ဖတ်လိုက်ပါ</span>
        </div>
      </div>

      <h2 class="sm-h">ဘောက်ချာ</h2>
      <div class="sm-list" style="padding:16px">
        <div class="fg">
          <div class="field"><label for="st-paper">စာရွက်အကျယ်</label>
            <select id="st-paper"><option value="58" ${v.paper == 58 ? 'selected' : ''}>58 mm</option><option value="80" ${v.paper == 80 ? 'selected' : ''}>80 mm</option></select></div>
          <div class="field"><label for="st-copies">ကော်ပီ အရေအတွက်</label>

          <div class="field full"><label for="st-name">ဆိုင်အမည်</label><input type="text" id="st-name" value="${esc(v.shopName)}" autocomplete="off"></div>
          <div class="field full"><label for="st-addr">လိပ်စာ</label><input type="text" id="st-addr" value="${esc(v.shopAddr)}" autocomplete="off"></div>
          <div class="field"><label for="st-phone">ဖုန်းနံပါတ်</label><input type="text" id="st-phone" inputmode="tel" value="${esc(v.shopPhone)}" autocomplete="off"></div>
          <div class="field"><label for="st-foot">အောက်ခြေစာ</label><input type="text" id="st-foot" value="${esc(v.footer)}" autocomplete="off"></div>
          <label class="check full"><input type="checkbox" id="st-auto" ${v.autoPrint ? 'checked' : ''}><span>ရောင်းပြီးတိုင်း ဘောက်ချာ အလိုအလျောက် ပရင့်ထုတ်မည်</span></label>

          <button type="button" class="btn primary" id="st-save" style="min-width:140px">သိမ်းမည်</button>
        </div>
      </div>

      <h2 class="sm-h">ပရင့်ထုတ်ခြင်း</h2>
      <div class="sm-list" style="padding:16px; display:grid; gap:12px">
        <p style="margin:0; font-size:14px">Android တွင် RawBT app ထဲ၌ ပရင့်စက်ကို ချိတ်ထားရမည်။ ဘောက်ချာကို RawBT သို့ ပို့ပြီး ပရင့်ထုတ်မည်။ iPhone / ကွန်ပျူတာတွင် ဘောက်ချာကို ပုံအဖြစ် သိမ်း/မျှဝေပေးမည်။ အပေါ်က တန်ဖိုးများ မသိမ်းရသေးလည်း စမ်းလို့ရသည်။</p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <button type="button" class="btn" id="st-prev-btn">ဘောက်ချာ ပုံကြည့်ရန်</button>
          <button type="button" class="btn primary" id="st-test-btn">စမ်းပရင့်ထုတ်ရန်</button>
        </div>
        <div id="st-prev"></div>
      </div>
    </div>`;

    const $ = id => document.getElementById(id);
    $('st-save').addEventListener('click', async () => {
      const copies = Number($('st-copies').value);
      const wrap = $('st-copies').closest('.field'), msg = wrap.querySelector('.msg');
      if (!Number.isInteger(copies) || copies < 1 || copies > 5) {
        wrap.classList.add('err'); msg.textContent = '၁ မှ ၅ အတွင်း ထည့်ပါ'; $('st-copies').focus(); return;

      wrap.classList.remove('err');
      const next = {
        ...v, scanEnabled: $('st-scan').checked, scanBeep: $('st-beep').checked,
        paper: Number($('st-paper').value), copies,
        shopName: $('st-name').value.trim(), shopAddr: $('st-addr').value.trim(),
        shopPhone: $('st-phone').value.trim(), footer: $('st-foot').value.trim(),
        autoPrint: $('st-auto').checked,

      catch (e) { console.error(e); toast('သိမ်း၍ မရပါ'); }

    const formCfg = () => ({
      ...v, paper: Number($('st-paper').value), shopName: $('st-name').value.trim(), shopAddr: $('st-addr').value.trim(),
      shopPhone: $('st-phone').value.trim(), footer: $('st-foot').value.trim(), autoPrint: $('st-auto').checked,
      copies: Math.min(5, Math.max(1, parseInt($('st-copies').value, 10) || 1)),
    });
    $('st-prev-btn').addEventListener('click', async () => {
      try {
        const c = await window.POSPrint.renderReceipt(window.POSPrint.sample(), formCfg());
        $('st-prev').innerHTML = `<img alt="ဘောက်ချာ နမူနာ" src="${c.toDataURL()}" style="max-width:100%; background:#fff; border:1px solid var(--line); border-radius:8px">`;
      } catch (e) { console.error(e); toast('ပုံဆွဲ၍ မရပါ'); }
    });
    $('st-test-btn').addEventListener('click', async () => {
      try {
        const r = await window.POSPrint.printSale(window.POSPrint.sample(), { cfg: formCfg() });
        toast(r === 'rawbt' ? 'RawBT သို့ ပို့ပြီးပါပြီ' : 'ပုံ ပြင်ဆင်ပြီးပါပြီ');
      } catch (e) { console.error(e); toast('ပရင့်ထုတ်၍ မရပါ'); }
    });

    window.POSScan.start((code, m) => {
      $('st-res').textContent = code;
      $('st-info').textContent = `${m.len} လုံး · ${m.ms} ms ဖြင့် ဖတ်ပြီး`;
      return 'ok';
    });
  }

  const prev = window.showPage;
  window.showPage = function (id, label) {
    if (id.split('/')[0] === 's-print') renderSettings();
    else { if (window.POSScan) window.POSScan.stop(); prev(id, label); }
  };
})();

<script>
/* ---------- Receipt printing ----------
   The receipt is drawn on a canvas (so Burmese text renders correctly), converted to ESC/POS
   raster data and handed to RawBT on Android via its intent link. Other devices get a PNG to save/share. */
(() => {
  const DEF = { paper: 58, shopName: '', shopAddr: '', shopPhone: '', footer: '', copies: 1, autoPrint: false };
  const FONT = '"Noto Sans Myanmar","Myanmar Text","Padauk","Pyidaungsu",sans-serif';
  const num = n => Math.round(Number(n) || 0).toLocaleString('en-US');
  const qty = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });
  const p2 = n => String(n).padStart(2, '0');
  const stamp = t => { const d = new Date(t); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };

  function loadCfg() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('pos-db', 5);
        r.onupgradeneeded = () => {
          ['products', 'categories', 'units', 'meta', 'purchases', 'sales', 'expenses', 'adjustments', 'customers', 'suppliers'].forEach(n => {
            if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' });
          });
        };
        r.onsuccess = () => {
          const db = r.result;
          try {
            const q = db.transaction('meta').objectStore('meta').get('settings');
            q.onsuccess = () => { db.close(); res({ ...DEF, ...((q.result && q.result.value) || {}) }); };
            q.onerror = () => { db.close(); res({ ...DEF }); };
          } catch (e) { db.close(); res({ ...DEF }); }
        };
        r.onerror = () => res({ ...DEF });
      } catch (e) { res({ ...DEF }); }
    });
  }

  /* ---- text wrapping (Burmese has no spaces: use word segmentation, then graphemes) ---- */
  const wordSeg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('my', { granularity: 'word' }) : null;
  const graphSeg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('my', { granularity: 'grapheme' }) : null;
  const pieces = t => wordSeg ? Array.from(wordSeg.segment(t), s => s.segment) : t.split(/(?<=\s)/);
  const graphemes = t => graphSeg ? Array.from(graphSeg.segment(t), s => s.segment) : Array.from(t);
  function wrap(ctx, text, maxW) {
    const lines = []; let cur = '';
    for (const p of pieces(String(text))) {
      if (ctx.measureText(cur + p).width <= maxW) { cur += p; continue; }
      if (cur.trim()) { lines.push(cur.trimEnd()); }
      cur = '';
      if (ctx.measureText(p).width <= maxW) { cur = p.replace(/^\s+/, ''); continue; }
      for (const g of graphemes(p)) {
        if (ctx.measureText(cur + g).width <= maxW) cur += g; else { lines.push(cur); cur = g; }
      }
    }
    if (cur.trim()) lines.push(cur.trimEnd());
    return lines.length ? lines : [''];
  }

  /* ---- receipt layout; draw=false only measures the height ---- */
  function paint(ctx, W, sale, cfg, draw) {
    const M = 6, inner = W - M * 2;
    let y = 6;
    const font = (size, bold) => { ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; };
    const lineH = size => Math.round(size * 1.55);
    const put = (t, x, base, align) => { ctx.textAlign = align; ctx.fillText(t, x, base); };
    const block = (t, size = 22, bold = false, align = 'left') => {
      if (!String(t || '').trim()) return;
      font(size, bold); const lh = lineH(size);
      for (const l of wrap(ctx, t, inner)) {
        if (draw) put(l, align === 'center' ? W / 2 : align === 'right' ? W - M : M, y + Math.round(lh * 0.74), align);
        y += lh;
      }
    };
    const row = (left, right, size = 22, bold = false) => {
      font(size, bold); const lh = lineH(size);
      const rw = Math.ceil(ctx.measureText(right).width);
      wrap(ctx, left, Math.max(60, inner - rw - 10)).forEach((l, i) => {
        if (draw) { const b = y + Math.round(lh * 0.74); put(l, M, b, 'left'); if (i === 0) put(right, W - M, b, 'right'); }
        y += lh;
      });
    };
    const sep = () => { y += 4; if (draw) for (let x = M; x < W - M; x += 10) ctx.fillRect(x, y, 6, 2); y += 10; };

    if (cfg.shopName) block(cfg.shopName, 30, true, 'center');
    block(cfg.shopAddr, 20, false, 'center');
    if (cfg.shopPhone) block('ဖုန်း: ' + cfg.shopPhone, 20, false, 'center');
    if (cfg.shopName || cfg.shopAddr || cfg.shopPhone) sep();
    row('ပြေစာအမှတ်', String(sale.no), 22);
    block(stamp(sale.createdAt), 22);
    if (sale.customerName) block('ဖောက်သည်: ' + sale.customerName, 22);
    if (sale.delivery) {
      block('ပို့ရန်: ' + (sale.delivery.address || ''), 22);
      if (sale.delivery.phone) block('ဖုန်း: ' + sale.delivery.phone, 22);
    }
    sep();
    for (const it of sale.items) {
      block(it.name, 24, true);
      row(`${qty(it.qty)} ${it.unit || ''} × ${num(it.price)}`, num(Math.round(it.qty * it.price)), 22);
    }
    sep();
    const dc = Number(sale.deliveryCharge) || 0, dv = sale.delivery;
    if (sale.discount > 0 || dc > 0) row('ကုန်ပစ္စည်းတန်ဖိုး', num(sale.subtotal));
    if (sale.discount > 0) row('လျှော့စျေး', '- ' + num(sale.discount));
    if (dc > 0) row('Delivery charge', num(dc));
    row('စုစုပေါင်း', num(sale.total + dc) + ' ကျပ်', 28, true);
    if (dv && dv.cod) row('ပို့ပြီးမှ ပေးရန်', num(sale.total + dc), 24, true);
    else if (sale.credit) { row('ရရှိငွေ', num(sale.paid)); row('အကြွေးကျန်', num(Math.max(0, sale.total + dc - sale.paid)), 24, true); }
    else { row('ရရှိငွေ', num(sale.paid)); row('ပြန်အမ်းငွေ', num(sale.change)); }
    if (String(cfg.footer || '').trim()) { sep(); block(cfg.footer, 22, false, 'center'); }
    return y + 28;
  }

  async function renderReceipt(sale, cfg) {
    try { await document.fonts.ready; } catch (e) { /* ignore */ }
    const W = Number(cfg.paper) === 80 ? 576 : 384;      // printable dots at 203 dpi
    const H = paint(document.createElement('canvas').getContext('2d'), W, sale, cfg, false);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
    paint(ctx, W, sale, cfg, true);
    return c;
  }

  /* ---- canvas -> ESC/POS raster (GS v 0), in bands of 240 rows ---- */
  function toEscpos(canvas, copies) {
    const w = canvas.width, h = canvas.height, wb = w >> 3;
    const px = canvas.getContext('2d').getImageData(0, 0, w, h).data;
    const BAND = 240, bands = Math.ceil(h / BAND);
    const one = 2 + bands * 8 + wb * h + 3;
    const out = new Uint8Array(one * copies);
    let o = 0;
    for (let c = 0; c < copies; c++) {
      out[o++] = 0x1b; out[o++] = 0x40;                    // ESC @  (initialise)
      for (let y0 = 0; y0 < h; y0 += BAND) {
        const bh = Math.min(BAND, h - y0);
        out.set([0x1d, 0x76, 0x30, 0x00, wb & 255, wb >> 8, bh & 255, bh >> 8], o); o += 8;
        for (let y = y0; y < y0 + bh; y++) for (let xb = 0; xb < wb; xb++) {
          let b = 0;
          for (let bit = 0; bit < 8; bit++) {
            const i = (y * w + xb * 8 + bit) * 4;
            if (px[i + 3] > 0 && (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) < 150) b |= 0x80 >> bit;
          }
          out[o++] = b;
        }
      }
      out[o++] = 0x1b; out[o++] = 0x64; out[o++] = 0x04;   // ESC d 4 (feed 4 lines)
    }
    return out;
  }

  function b64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  const rawbtUrl = bytes => 'intent:base64,' + b64(bytes) + '#Intent;scheme=RawBT;package=ru.a402d.RawBTprinter;end;';

  async function saveImage(canvas, name) {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], name + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  function sample() {
    const items = [
      { name: 'နမူနာ ကုန်ပစ္စည်း', unit: 'ခု', qty: 2, price: 1500 },
      { name: 'ကော်ဖီမစ် ၃ ခုတွဲ အထုပ်ကြီး', unit: 'ထုပ်', qty: 1, price: 4800 },
    ];
    const subtotal = items.reduce((a, it) => a + Math.round(it.qty * it.price), 0);
    return { no: 'TEST-0001', createdAt: Date.now(), items, subtotal, discount: 300, total: subtotal - 300, paid: 10000, change: 10000 - (subtotal - 300) };
  }

  window.POSPrint = {
    loadCfg, renderReceipt, sample,
    // -> 'rawbt' (sent to RawBT) | 'image' (PNG saved/shared) | 'skip' (auto-print is off)
    async printSale(sale, opt = {}) {
      const cfg = opt.cfg || await loadCfg();
      if (opt.auto && !cfg.autoPrint) return 'skip';
      const canvas = await renderReceipt(sale, cfg);
      if (/Android/i.test(navigator.userAgent)) {
        const copies = Math.min(5, Math.max(1, parseInt(cfg.copies, 10) || 1));
        window.location.href = rawbtUrl(toEscpos(canvas, copies));
        return 'rawbt';
      }
      await saveImage(canvas, 'receipt-' + sale.no);
      return 'image';
    },
    _toEscpos: toEscpos, _wrap: wrap,
  };
})();
</script>
<script>
/* Runs last on every page: opens the right page + highlights the menu */
(() => {
  const q = new URLSearchParams(location.search);
  let id = document.body.dataset.page || 'summary';
  let label = document.body.dataset.title || 'အနှစ်ချုပ်';
  if (q.get('p')) { id = q.get('p'); label = q.get('t') || label; }
  if (q.get('new')) id = id.split('/')[0] + '/new';
  const parent = id.split('/')[0];                       // open the submenu that holds the active item
  const sub = drawer.querySelector(`.sub[data-parent="${CSS.escape(parent)}"]`);
  if (sub) {
    sub.classList.add('open');
    const head = sub.previousElementSibling;
    if (head) { head.classList.add('open'); head.setAttribute('aria-expanded', 'true'); }
  }
  setActive(id, label);
})();
</script>
<script src="lowstock.js"></script>
