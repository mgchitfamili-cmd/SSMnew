<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>POS – လက်လီအရောင်း</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #7c3aed;
    --accent-soft: #ede9fe;
    --ink: #1f2937;
    --muted: #9ca3af;
    --line: #e5e7eb;
    --surface: #ffffff;
    --page: #f3f4f8;
    --drawer-w: min(320px, 86vw);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #a78bfa;
      --accent-soft: #2e2457;
      --ink: #e5e7eb;
      --muted: #6b7280;
      --line: #2b2f3a;
      --surface: #171a22;
      --page: #0f1117;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans Myanmar", "Padauk", system-ui, sans-serif;
    background: var(--page);
    color: var(--ink);
    line-height: 1.6;
    overflow: hidden;
  }

  /* ---------- Top bar + main ---------- */
  .app { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: calc(var(--safe-top) + 8px) 12px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 12px;
    background: transparent; color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--accent-soft); }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  main { flex: 1; overflow: auto; padding: 20px; }
  main p { color: var(--muted); margin: 4px 0 0; }

  /* ---------- Drawer ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(15, 17, 23, .5);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 40;
  }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: var(--drawer-w);
    background: var(--surface);
    transform: translateX(-100%);
    transition: transform .28s cubic-bezier(.3, .8, .3, 1);
    z-index: 50;
    overflow-y: auto; overscroll-behavior: contain;
    padding: calc(var(--safe-top) + 12px) 0 calc(var(--safe-bottom) + 24px);
    box-shadow: 4px 0 24px rgba(0, 0, 0, .15);
  }
  body.menu-open .drawer { transform: none; }
  body.menu-open .backdrop { opacity: 1; pointer-events: auto; }
  body.dragging .drawer, body.dragging .backdrop { transition: none; }

  .group-title {
    margin: 18px 20px 6px; font-size: 14px; font-weight: 700; color: var(--ink);
  }
  .group-title:first-child { margin-top: 8px; }

  .item {
    display: flex; align-items: center; gap: 16px;
    width: calc(100% - 24px); margin: 0 12px;
    min-height: 48px; padding: 0 12px;
    border: 0; border-radius: 12px; background: transparent;
    font: inherit; font-size: 16px; color: var(--ink); text-align: left;
    cursor: pointer;
  }
  .item:active { background: var(--accent-soft); }
  .item svg { flex: none; }
  .item .label { flex: 1; }
  .item .chev { transition: transform .2s; color: var(--ink); }
  .item.open .chev { transform: rotate(180deg); }
  .item.active { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
  .item.disabled { color: var(--muted); }
  .item.disabled .chev { color: var(--muted); }

  .sub { display: none; margin: 0 12px 4px 56px; border-left: 2px solid var(--line); }
  .sub.open { display: block; }
  .sub .item { width: 100%; margin: 0; min-height: 42px; font-size: 15px; padding-left: 16px; }

  /* Wide screens (iPad landscape): menu stays visible */
  @media (min-width: 1024px) {
    .drawer { transform: none; box-shadow: none; border-right: 1px solid var(--line); }
    .backdrop { display: none; }
    .app { margin-left: var(--drawer-w); }
    #menuBtn { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .backdrop, .item .chev { transition: none; }
  }

  /* =====================================================
     ကုန်ပစ္စည်း (Products) page
     ===================================================== */
  :root {
    --on-accent: #ffffff;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --on-accent: #1b1033;
      --danger: #f87171;
      --danger-soft: #3b1c1c;
      --warn: #fbbf24;
    }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pg { max-width: 1240px; margin: 0 auto; }

  /* Buttons */
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap;
  }
  .btn:active { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:active { filter: brightness(.92); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .btn.small { min-height: 40px; padding: 0 14px; }
  @media (hover: hover) {
    .btn:hover { border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.06); }
  }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700;
    display: inline-grid; place-items: center;
  }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .search {
    flex: 1 1 100%; display: flex; align-items: center; gap: 10px;
    min-height: 46px; padding: 0 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  }
  .search:focus-within { border-color: var(--accent); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 15px; color: var(--ink); height: 44px;
  }
  .toolbar .btn { flex: 1 1 0; }
  @media (min-width: 700px) {
    .search { flex: 1 1 320px; }
    .toolbar .btn { flex: 0 0 auto; }
  }
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
    margin-top: 12px; padding: 14px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .filters[hidden] { display: none; }
  .filters .reset { align-self: end; }
  .count { margin: 14px 2px 10px; font-size: 14px; color: var(--muted); }

  /* Form controls */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .flabel { font-size: 14px; font-weight: 500; }
  .field .req { color: var(--danger); margin-left: 3px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea, .addrow input {
    width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px;
  }
  .field textarea { min-height: 96px; padding: 10px 14px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus, .addrow input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field .help { font-size: 13px; color: var(--muted); }
  .field .msg { font-size: 13px; color: var(--danger); display: none; }
  .field.err input, .field.err select { border-color: var(--danger); }
  .field.err .msg { display: block; }
  .linkbtn {
    align-self: flex-start; border: 0; background: none; padding: 4px 0; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: underline;
  }
  .addrow { display: flex; gap: 8px; }
  .addrow[hidden] { display: none; }
  .addrow input { flex: 1; }
  .check { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

  /* Product visual */
  .pimg {
    width: 76px; height: 76px; flex: none; border-radius: 16px; overflow: hidden;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--line); display: grid; place-items: center;
  }
  .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pimg.sm { width: 48px; height: 48px; border-radius: 12px; }
  .pimg.lg { width: 112px; height: 112px; border-radius: 20px; }

  /* Narrow screens: cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .pcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .pcard.off { background: var(--page); }
  .phead { display: flex; gap: 14px; align-items: center; }
  .pname { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; }
  .psub { font-size: 14px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
  .kv dt { font-size: 13px; color: var(--muted); }
  .kv dd { margin: 0; font-size: 16px; font-weight: 600; }
  .chip {
    display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: var(--accent-soft); color: var(--accent);
  }
  .chip.off { background: var(--line); color: var(--muted); }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .abtn {
    min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .abtn:active { background: var(--accent-soft); }
  .abtn.del { color: var(--danger); }

  /* Wide screens (Windows): table */
  .tbl-wrap { display: none; }
  @media (min-width: 900px) {
    .cards { display: none; }
    .tbl-wrap { display: block; }
  }
  .tbl {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .tbl th {
    text-align: left; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 12px 14px; background: var(--page); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .tbl td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
  .tbl tbody tr:first-child td { border-top: 0; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl tr.off td:not(.st):not(.ac) > * { opacity: .55; }
  .tcell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .tcell .pname { font-size: 16px; }
  .tcell .psub { font-size: 13px; }
  .tact { display: flex; gap: 6px; justify-content: flex-end; }
  .ibtn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  .ibtn:active, .ibtn:hover { background: var(--accent-soft); }
  .ibtn.del { color: var(--danger); }
  .ibtn.del:hover { background: var(--danger-soft); }
  @media (hover: hover) { .tbl tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); } }

  /* Empty state */
  .empty {
    text-align: center; padding: 56px 20px; border-radius: 18px;
    border: 1px dashed var(--line); background: var(--surface);
  }
  .empty .pimg { margin: 0 auto 14px; width: 72px; height: 72px; }
  .empty h3 { margin: 0 0 6px; font-size: 18px; }
  .empty p { margin: 0 0 18px; color: var(--muted); }
  .empty .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Dialogs */
  dialog.dlg {
    padding: 0; border: 0; border-radius: 20px; color: var(--ink); background: var(--surface);
    width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
  }
  dialog.dlg.narrow { width: min(420px, calc(100vw - 32px)); }
  dialog.dlg[open] { display: flex; flex-direction: column; }
  dialog.dlg::backdrop { background: rgba(15, 17, 23, .55); }
  .dh {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px 10px 22px; border-bottom: 1px solid var(--line); flex: none;
  }
  .dh h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .db { padding: 6px 22px 20px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  .df {
    display: flex; gap: 10px; padding: 12px 22px calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--line); flex: none;
  }
  .df .btn { flex: 1; }
  @media (min-width: 640px) { .df { justify-content: flex-end; } .df .btn { flex: 0 0 auto; min-width: 140px; } }
  @media (max-width: 639px) {
    dialog.dlg:not(.narrow) {
      width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0;
    }
  }
  .sec {
    margin: 22px 0 14px; padding-bottom: 8px; font-size: 16px; font-weight: 700; color: var(--accent);
    border-bottom: 2px solid var(--accent-soft);
  }
  .sec:first-child { margin-top: 14px; }
  .fg { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .fg { grid-template-columns: 1fr 1fr; } .fg .full { grid-column: 1 / -1; } }
  .imgrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hint { font-size: 13px; color: var(--muted); min-height: 20px; }
  .hint.warn { color: var(--warn); }
  .detail-top { display: flex; gap: 16px; align-items: center; margin: 16px 0 8px; }
  .detail-top .pname { font-size: 20px; }
  .detail-desc { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--page); white-space: pre-wrap; }
  .confirm-text { margin: 20px 0 6px; font-size: 16px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 12px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* =====================================================
     ဝယ်ယူမှု (Purchase) page
     ===================================================== */
  .field input[type=date] {
    width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px;
  }
  .field input[type=date]:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pickres { margin-top: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .pickres[hidden] { display: none; }
  .pick {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px;
    border: 0; border-top: 1px solid var(--line); background: transparent;
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  }
  .pick:first-child { border-top: 0; }
  .pick:active, .pick:hover { background: var(--accent-soft); }
  .irow { border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 10px; background: var(--surface); }
  .ihead { display: flex; align-items: center; gap: 12px; }
  .ihead .iname { flex: 1; min-width: 0; }
  .igrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .igrid .field:last-child { grid-column: 1 / -1; }
  @media (min-width: 640px) { .igrid { grid-template-columns: 1fr 1fr 1fr; } .igrid .field:last-child { grid-column: auto; } }
  .ltotal { min-height: 46px; display: flex; align-items: center; font-weight: 600; font-size: 16px; }
  .tot { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--page); display: grid; gap: 6px; }
  .tot > div { display: flex; justify-content: space-between; gap: 12px; }
  .tot .grand { font-size: 18px; font-weight: 700; }
  .vrow { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .due { color: var(--danger); font-weight: 600; }
  .chip.debt { background: var(--danger-soft); color: var(--danger); }

  /* =====================================================
     လက်လီအရောင်း (Retail POS) page
     ===================================================== */
  .rt-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) {
    .rt-grid { grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); align-items: start; }
    .rt-cartbox { position: sticky; top: 0; max-height: calc(100dvh - 110px); overflow-y: auto; }
  }
  .rt-top { display: flex; gap: 10px; flex-wrap: wrap; }
  .rt-top .search { flex: 1 1 220px; }
  .rt-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .rt-tile {
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left;
    padding: 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font: inherit; cursor: pointer;
  }
  .rt-tile:active { background: var(--accent-soft); }
  @media (hover: hover) { .rt-tile:hover { border-color: var(--accent); } }
  .rt-tile .tname { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .rt-tile .tprice { font-size: 15px; font-weight: 700; color: var(--accent); }
  .rt-tile.out { opacity: .5; }
  .rt-cartbox { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 14px 14px; }
  .rt-cartbox .irow { background: var(--page); }
  .rt-cartbox .igrid { grid-template-columns: 1fr 1fr; }
  .rt-cartbox .igrid .field:last-child { grid-column: 1 / -1; }
  .rt-cart-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rt-cart-h .sec { flex: 1; }
  .rt-cart-h .linkbtn { align-self: center; margin-top: 8px; }
  .qtyrow { display: flex; gap: 6px; }
  .qtyrow input { text-align: center; min-width: 0; flex: 1; }
  .qtyrow .btn { padding: 0; width: 44px; flex: none; font-size: 20px; }
  .warnline { font-size: 13px; color: var(--warn); margin-top: 6px; }
  .rt-chg { font-size: 26px; font-weight: 700; }
  .rt-bar {
    position: sticky; bottom: 0; margin-top: 16px; display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 16px; background: var(--accent); color: var(--on-accent);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
  }
  .rt-bar .grow { flex: 1; min-width: 0; }
  .rt-bar b { font-size: 18px; }
  .rt-bar .btn { background: var(--on-accent); color: var(--accent); border-color: transparent; font-weight: 600; }
  @media (min-width: 900px) { .rt-bar { display: none; } }
</style>
<script src="acct.js"></script>
</head>
<body data-page="retail" data-title="လက်လီအရောင်း">

<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="မီနူး ဖွင့်ရန်">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 id="pageTitle">လက်လီအရောင်း</h1>
  </header>
  <main id="content"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<nav class="drawer" id="drawer" aria-label="အဓိက မီနူး"></nav>

<script>
/* ---------- Icons (24x24, stroke) ---------- */
const ICONS = {
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  cart: '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.7 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 7H6"/>',

          <span class="label">${c.label}</span></button>`).join('')}
      </div>` : ''}
    `).join('')}

}

function setActive(id, label) {
  activeId = id;
  titleEl.textContent = label;
  window.showPage(id, label);
  drawer.querySelectorAll('.item.active').forEach(el => el.classList.remove('active'));
  const el = drawer.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (el) el.classList.add('active');
  if (window.matchMedia('(max-width: 1023px)').matches) closeMenu();
}

drawer.addEventListener('click', e => {
  const btn = e.target.closest('.item');
  if (!btn) return;
  if (btn.dataset.sub) {                       // expand / collapse
    const sub = drawer.querySelector(`.sub[data-parent="${btn.dataset.id}"]`);
    const open = sub.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open);
    return;
  }
  const label = btn.dataset.label || btn.querySelector('.label').textContent;
  go(btn.dataset.id, label);
});

/* ---------- Multi-page navigation ---------- */
const ROUTES = {
  'products/list': 'products.html', 'products/new': 'products.html?new=1',
  'purchase/list': 'purchase.html', 'purchase/new': 'purchase.html?new=1',
  'summary': 'index.html', 'retail': 'retail.html',
  'sales/list': 'sales.html', 'sales/new': 'retail.html', 'delivery': 'delivery.html', 'closing': 'closing.html',
  'expense/list': 'expense.html', 'expense/new': 'expense.html?new=1',
  'debt/list': 'debt.html', 'debt/new': 'debt.html?new=1',
  'adjust/list': 'adjust.html', 'adjust/new': 'adjust.html?new=1',
  'customers': 'customers.html', 'users': 'staff.html', 'suppliers': 'suppliers.html', 'accounts': 'accounts.html',
  'r-purchase/view': 'reports.html?p=r-purchase%2Fview', 'r-sales/view': 'reports.html?p=r-sales%2Fview', 'r-cash/view': 'reports.html?p=r-cash%2Fview', 'r-adjust/view': 'reports.html?p=r-adjust%2Fview', 'r-stock': 'reports.html?p=r-stock', 'r-profit': 'reports.html?p=r-profit', 'r-expense': 'reports.html?p=r-expense', 'r-account': 'reports.html?p=r-account',
};
function go(id, label) {
  const target = ROUTES[id] || 'index.html?p=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(label);
  const here = location.pathname.split('/').pop() || 'index.html';
  if (target.split('?')[0] === here) setActive(id, label);   // same page: no reload
  else location.href = target;
}

/* default page body (pages that have a real module overwrite showPage) */

  document.getElementById('content').innerHTML = '<p>ဒီနေရာမှာ စာမျက်နှာ အကြောင်းအရာ ထည့်ပါမယ်။</p>';
};

/* ---------- Open / close ---------- */
const openMenu  = () => document.body.classList.add('menu-open');
const closeMenu = () => document.body.classList.remove('menu-open');
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('backdrop').addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ---------- Swipe: open from left edge, close by swiping left ---------- */
const DRAWER_W = () => drawer.getBoundingClientRect().width || 300;
let startX = 0, startY = 0, dx = 0, mode = null;

document.addEventListener('touchstart', e => {
  if (window.matchMedia('(min-width: 1024px)').matches) return;
  const t = e.touches[0];
  startX = t.clientX; startY = t.clientY; dx = 0; mode = null;
  const isOpen = document.body.classList.contains('menu-open');
  if (!isOpen && startX < 20) mode = 'open';
  else if (isOpen) mode = 'close';
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!mode) return;
  const t = e.touches[0];
  dx = t.clientX - startX;
  if (Math.abs(t.clientY - startY) > Math.abs(dx) && !document.body.classList.contains('dragging')) { mode = null; return; }
  document.body.classList.add('dragging');
  const w = DRAWER_W();
  const x = mode === 'open' ? Math.min(0, -w + dx) : Math.min(0, dx);
  drawer.style.transform = `translateX(${x}px)`;
  document.getElementById('backdrop').style.opacity = String(1 + x / w);
  document.getElementById('backdrop').style.pointerEvents = 'auto';
}, { passive: true });

document.addEventListener('touchend', () => {
  if (!mode) return;
  document.body.classList.remove('dragging');
  drawer.style.transform = '';
  const bd = document.getElementById('backdrop');
  bd.style.opacity = ''; bd.style.pointerEvents = '';
  if (mode === 'open' && dx > 80) openMenu();
  if (mode === 'close' && dx < -80) closeMenu();
  mode = null;
});

render();

<script>
/* Shared data layer + helpers (used by products.js and purchase.js) */
(() => {
Object.assign(ICONS, {
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  filter: '<path d="M4 7h16M7 12h10M10 17h4"/>',
  plus:   '<path d="M12 5v14M5 12h14"/>',
  eye:    '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  edit:   '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  power:  '<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',
  trash:  '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
  x:      '<path d="M6 6l12 12M18 6L6 18"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
});


const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('pos-db', 5);
      r.onupgradeneeded = () => {
        const db = r.result;
        ['products', 'categories', 'units', 'meta', 'purchases', 'sales', 'expenses', 'adjustments', 'customers', 'suppliers'].forEach(n => {
          if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: 'id' });
        });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  all(n) {
    return new Promise((res, rej) => {
      const q = this.db.transaction(n).objectStore(n).getAll();
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  put(n, o) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(n, 'readwrite'); t.objectStore(n).put(o);
      t.oncomplete = () => res(o); t.onerror = () => rej(t.error);
    });
  },
  del(n, id) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(n, 'readwrite'); t.objectStore(n).delete(id);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
    });
  },
};

/* ---------- Defaults (categories & units are editable by the user) ---------- */
const DEFAULT_CATEGORIES = ['ကလေးသုံးပစ္စည်း', 'အစားအသောက်', 'အိမ်သုံးပစ္စည်း', 'အလှကုန်']
  .map((name, i) => ({ id: 'c' + (i + 1), name }));
const DEFAULT_UNITS = [
  'ခု', 'ထုပ်', 'အထုပ်', 'ဘူး', 'ဗူး', 'ဒါဇင်', 'ပိဿာ', 'ကျပ်သား', 'ပေါင်', 'ကီလို', 'လီတာ',
].map((name, i) => ({ id: 'u' + (i + 1), name }));

const S = { products: [], categories: [], units: [], purchases: [], sales: [], seq: 0, poSeq: 0, saleSeq: 0 };
let storeError = null;

async function initStore() {
  await idb.open();
  S.products   = await idb.all('products');
  S.categories = await idb.all('categories');
  S.units      = await idb.all('units');
  const meta = await idb.all('meta');
  S.purchases  = await idb.all('purchases');
  S.sales      = await idb.all('sales');
  S.seq = (meta.find(m => m.id === 'seq') || {}).value || 0;
  S.poSeq = (meta.find(m => m.id === 'poSeq') || {}).value || 0;
  S.saleSeq = (meta.find(m => m.id === 'saleSeq') || {}).value || 0;
  if (!meta.some(m => m.id === 'seeded')) {
    for (const c of DEFAULT_CATEGORIES) { await idb.put('categories', c); S.categories.push(c); }
    for (const u of DEFAULT_UNITS)      { await idb.put('units', u);      S.units.push(u); }
    await idb.put('meta', { id: 'seeded', value: 1 });
  }
}
const ready = initStore().catch(err => { storeError = err; console.error(err); });

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const F = id => document.getElementById('f-' + id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n).toLocaleString('en-US') + ' ကျပ်';
const norm = s => String(s ?? '').toLowerCase();
const qty = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const catName  = id => (S.categories.find(c => c.id === id) || {}).name || '-';
const unitName = id => (S.units.find(u => u.id === id) || {}).name || '-';
const titleOf = p => p.nameMm || p.name;
const subOf   = p => (p.nameMm ? p.name : '');
const find = id => S.products.find(p => p.id === id);
const parsePrice = x => {
  const s = String(x ?? '').trim(); if (s === '') return null;
  const n = Number(s); return Number.isFinite(n) && n >= 0 ? Math.round(n) : null;
};
const thumb = (p, cls = '') =>
  `<div class="pimg ${cls}">${p.image ? `<img src="${p.image}" alt="">` : svg('box', cls === 'sm' ? 22 : cls === 'lg' ? 44 : 34)}</div>`;

let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function fileToThumb(file, max = 240) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}


/* ---------- Shared dialogs (confirm + toast + close buttons) ---------- */
function ensureShared() {
  if ($('#cdlg')) return;
  document.body.insertAdjacentHTML('beforeend', `
<dialog class="dlg narrow" id="cdlg">
  <form method="dialog">
    <div class="db"><p class="confirm-text" id="cText"></p></div>
    <div class="df">
      <button class="btn" value="no">မလုပ်တော့ပါ</button>
      <button class="btn danger" value="ok" id="cOk">ဖျက်မည်</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>`);
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-close]'); if (b) b.closest('dialog').close();
  });
}

function ask(text, okLabel = 'ဖျက်မည်') {
  return new Promise(res => {
    const d = $('#cdlg'); $('#cText').textContent = text; $('#cOk').textContent = okLabel;
    d.returnValue = ''; d.addEventListener('close', () => res(d.returnValue === 'ok'), { once: true });
    d.showModal();
  });
}


window.POS = { idb, S, ready, storeError: () => storeError, ensureShared,
  $, F, esc, money, qty, uid, norm, toast, ask, thumb, titleOf, subOf, find, parsePrice,
  catName, unitName, fileToThumb, DEFAULT_UNITS };
})();
</script>
<script>
/* လက်လီအရောင်း (Retail POS) page */
(() => {
const { idb, S, ready, $, esc, money, qty, uid, norm, toast, ask, thumb, titleOf, find, parsePrice, unitName } = window.POS;
const R = id => document.getElementById('rt-' + id);
let custs = [];
async function loadCusts() {
  try {
    custs = await idb.all('customers');
    const el = R('custs'); if (!el) return;
    const dl = R('dcos');
    if (dl) dl.innerHTML = [...new Set(S.sales.map(x => x.delivery && x.delivery.courier).filter(Boolean))].map(v => `<option value="${esc(v)}">`).join('');
    el.innerHTML = custs.slice().sort((a, b) => a.name.localeCompare(b.name, 'my')).map(c => `<option value="${esc(c.name)}">`).join('');
  } catch (err) { console.error(err); }
}
async function loadStaff() {      // အသုံးပြုသူ (staff.html) → ရောင်းသူ drop-down
  const sel = R('seller'); if (!sel) return;
  try {
    const list = (await idb.all('meta')).filter(m => String(m.id).startsWith('staff-')).sort((a, b) => a.name.localeCompare(b.name, 'my'));
    let keep = sel.value; if (!keep) { try { keep = localStorage.getItem('ssm.seller') || ''; } catch (e) {} }
    sel.innerHTML = `<option value="">${list.length ? '— ရောင်းသူ ရွေးပါ —' : '— အသုံးပြုသူ မရှိသေးပါ —'}</option>`
      + list.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
    if (list.some(m => m.id === keep)) sel.value = keep;
  } catch (err) { console.error(err); }
}
const custOf = nm => custs.find(c => norm(c.name) === norm(nm));

let cart = [], paidTouched = false, viewId = null;
const U = { q: '', hq: '' };

/* ---------- helpers ---------- */
const n = x => { const v = Number(x); return Number.isFinite(v) && v >= 0 ? v : 0; };
const round3 = x => Math.round(x * 1000) / 1000;
const lineOf = it => Math.round(n(it.qty) * n(it.price));
const pad = v => String(v).padStart(2, '0');
const dmy = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function nextNo() {
  let no;
  do { S.saleSeq++; no = 'S-' + String(S.saleSeq).padStart(4, '0'); } while (S.sales.some(s => s.no === no));
  return no;
}

// one transaction: sale + product stock (+ counter) succeed or fail together
function commit({ put, del, products }) {
  return new Promise((res, rej) => {
    const t = idb.db.transaction(['sales', 'products', 'meta'], 'readwrite');
    if (put) t.objectStore('sales').put(put);
    if (del) t.objectStore('sales').delete(del);
    (products || []).forEach(p => t.objectStore('products').put(p));
    t.objectStore('meta').put({ id: 'saleSeq', value: S.saleSeq });
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}

function setErr(key, msg) {
  const w = $('#w-' + key); if (!w) return;
  w.classList.toggle('err', !!msg); const m = w.querySelector('.msg'); if (m) m.textContent = msg || '';
}

/* ---------- Dialogs (created once) ---------- */
function ensureDlgs() {
  if ($('#rtview')) return;
  document.body.insertAdjacentHTML('beforeend', `
<dialog class="dlg" id="rtview" aria-labelledby="rt-vtitle">
  <div class="dh"><h2 id="rt-vtitle">ရောင်းချမှု အသေးစိတ်</h2>
    <button type="button" class="icon-btn" data-close aria-label="ပိတ်ရန်">${svg('x')}</button></div>
  <div class="db" id="rt-vbody"></div>
  <div class="df">
    <button type="button" class="btn danger" id="rt-void">ရောင်းချမှု ဖျက်ရန်</button>
    <button type="button" class="btn" id="rt-print">ပရင့်ထုတ်ရန်</button>
    <button type="button" class="btn primary" data-close>ပိတ်ရန်</button>
  </div>
</dialog>

<dialog class="dlg" id="rthist" aria-labelledby="rt-htitle">
  <div class="dh"><h2 id="rt-htitle">ရောင်းချမှု မှတ်တမ်း</h2>
    <button type="button" class="icon-btn" data-close aria-label="ပိတ်ရန်">${svg('x')}</button></div>
  <div class="db">
    <label class="search" style="margin-top:14px">${svg('search', 20)}<input id="rt-hq" type="search" placeholder="ပြေစာအမှတ်၊ ကုန်ပစ္စည်းဖြင့် ရှာရန်" autocomplete="off"></label>
    <div class="count" id="rt-hsum"></div>
    <div id="rt-hlist"></div>
  </div>
  <div class="df"><button type="button" class="btn" data-close>ပိတ်ရန်</button></div>
</dialog>`);

  $('#rtview').addEventListener('click', e => { if (e.target.id === 'rtview') e.target.close(); });
  $('#rthist').addEventListener('click', e => { if (e.target.id === 'rthist') e.target.close(); });
  $('#rt-void').addEventListener('click', voidSale);
  $('#rt-print').addEventListener('click', () => { const sl = S.sales.find(x => x.id === viewId); if (sl) doPrint(sl, false); });
  $('#rt-hq').addEventListener('input', e => { U.hq = e.target.value; renderHist(); });
  $('#rt-hlist').addEventListener('click', e => {
    const b = e.target.closest('[data-sale]'); if (!b) return;
    const s = S.sales.find(x => x.id === b.dataset.sale); if (s) openView(s, false);
  });
}

/* ---------- Page ---------- */
function mount() {
  paidTouched = false;
  $('#content').innerHTML = `
<div class="pg">
  <div class="rt-grid">
    <section>
      <div class="rt-top">
        <label class="search">${svg('search', 20)}<input id="rt-q" type="search" placeholder="အမည်၊ ကုဒ်၊ ဘားကုဒ်ဖြင့် ရှာရန်" autocomplete="off"></label>
      </div>
      <div class="count" id="rt-pcount"></div>
      <div id="rt-plist"></div>
    </section>

    <section class="rt-cartbox" id="rt-cartbox">
      <div class="rt-cart-h">
        <h3 class="sec">ဈေးခြင်း</h3>
        <button type="button" class="linkbtn" id="rt-clear">ရှင်းရန်</button>
      </div>
      <div class="field" id="w-rcart"><div class="msg"></div></div>
      <div id="rt-items"></div>

      <div class="fg" style="margin-top:14px">
        <div class="field full" id="w-rcust"><label for="rt-cust">ဖောက်သည်</label>
          <input type="text" id="rt-cust" list="rt-custs" autocomplete="off" placeholder="မဖြည့်လည်း ရသည်"><datalist id="rt-custs"></datalist></div>
        <div class="field full" id="w-rseller"><label for="rt-seller">ရောင်းသူ</label>
          <select id="rt-seller"><option value="">— ရောင်းသူ ရွေးပါ —</option></select></div>
        <div class="field full" id="w-rmode"><label for="rt-mode">ရောင်းနည်း</label>
          <select id="rt-mode"><option value="shop">ဆိုင်မှာရောင်းမည်</option><option value="own">Home Delivery</option><option value="co:Ko Nyein Chan Aung">Ko Nyein Chan Aung</option><option value="co:Royal Express">Royal Express</option><option value="co:Ninja Van">Ninja Van</option></select></div>
        <div class="full" id="rt-dbox" hidden><div class="fg">
          <div class="field" id="w-rdco"><label for="rt-dco" id="rt-dcolbl">ပို့သူအမည်</label>
            <input type="text" id="rt-dco" list="rt-dcos" autocomplete="off"><datalist id="rt-dcos"></datalist></div>
          <div class="field" id="w-rdchg"><label for="rt-dchg">Delivery charge (ကျပ်)</label>
            <input type="number" id="rt-dchg" min="0" step="1" inputmode="numeric" placeholder="0"></div>
          <div class="field" id="w-rdph"><label for="rt-dph">ဖုန်း</label>
            <input type="text" id="rt-dph" inputmode="tel" autocomplete="off"></div>
          <div class="field" id="w-rdad"><label for="rt-dad">ပို့ရမည့်လိပ်စာ</label>
            <input type="text" id="rt-dad" autocomplete="off"></div>
          <label class="check full"><input type="checkbox" id="rt-dcod"><span>ပို့ပြီးမှ ငွေကောက်မည် (COD)</span></label>
          <div class="field full" id="w-rdel"><div class="msg"></div></div>
          <div class="hint full" id="rt-dnote"></div>
        </div></div>
        <div class="field" id="w-rdisc"><label for="rt-disc">လျှော့စျေး (ကျပ်)</label>
          <input type="number" id="rt-disc" min="0" step="1" inputmode="numeric" placeholder="0"><div class="msg"></div></div>
        <div class="field" id="w-rpaid"><label for="rt-paid">ရရှိငွေ (ကျပ်)</label>
          <input type="number" id="rt-paid" min="0" step="1" inputmode="numeric"><div class="msg"></div></div>
        <div class="field" id="w-racct"><label for="rt-acct">ငွေလက်ခံသည့် အကောင့်</label><select id="rt-acct"></select></div>
      </div>
      <div class="tot" aria-live="polite">
        <div><span>ကုန်ပစ္စည်းတန်ဖိုး</span><span id="rt-sub">0 ကျပ်</span></div>
        <div id="rt-dline" hidden><span>Delivery charge</span><span id="rt-dval">0 ကျပ်</span></div>
        <div class="grand"><span>စုစုပေါင်း</span><span id="rt-total">0 ကျပ်</span></div>
        <div><span>ပြန်အမ်းငွေ</span><span id="rt-change">0 ကျပ်</span></div>
      </div>
      <div class="hint" id="rt-hint" style="margin-top:8px"></div>
      <button type="button" class="btn primary" id="rt-pay" style="width:100%;margin-top:12px;min-height:52px;font-size:17px">ရောင်းမည်</button>
    </section>
  </div>

  <div class="rt-bar">
    <div class="grow"><div style="font-size:13px"><span id="rt-barcount">0</span> မျိုး</div><b id="rt-bartotal">0 ကျပ်</b></div>
    <button type="button" class="btn" id="rt-bargo">ဈေးခြင်း ကြည့်ရန်</button>
  </div>
</div>`;

  $('#rt-q').value = U.q;
  $('#rt-q').addEventListener('input', e => { U.q = e.target.value; renderProducts(); });
  $('#rt-q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); pickFirst(); } });
  R('plist').addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) addToCart(b.dataset.pick); });

  const box = R('items');
  box.addEventListener('input', e => {
    const f = e.target.dataset.f; if (!f) return;
    const row = e.target.closest('.irow'), i = +row.dataset.i, it = cart[i];
    it[f] = e.target.value;
    row.querySelector('[data-lt]').textContent = money(lineOf(it));
    warnRow(i); updateTotals(); setErr('rcart', '');
  });
  box.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { cart.splice(+rm.dataset.rm, 1); renderCart(); return; }
    const st = e.target.closest('[data-step]');
    if (st) {
      const i = +st.dataset.i, it = cart[i], v = round3(n(it.qty) + Number(st.dataset.step));
      if (v <= 0) cart.splice(i, 1); else it.qty = String(v);
      renderCart();
    }
  });

  const syncMode = () => {
    const m = modeOf(), d = m !== 'shop';
    R('dbox').hidden = !d;
    const mv = R('mode').value;
    R('dco').value = m === 'company' ? mv.slice(3) : '';     // company is picked from the list
    $('#w-rdco').hidden = m === 'company';
    R('dcolbl').textContent = m === 'company' ? 'Delivery ကုမ္ပဏီအမည်' : 'ပို့သူအမည် (မဖြည့်လည်း ရ)';
    R('dnote').textContent = m === 'company'
      ? 'Delivery charge သည် ကုမ္ပဏီ၏ ငွေဖြစ်သည် (ဆိုင်ဝင်ငွေ မဟုတ်ပါ)။ COD ဆိုလျှင် ကုမ္ပဏီက charge ကို နှုတ်ပြီး ကျန်ငွေကို ဆိုင်သို့ ပြန်အပ်မည်။'
      : m === 'own' ? 'Delivery charge သည် ဆိုင်ဝင်ငွေ ဖြစ်သည်။' : '';
    if (!d) { R('dchg').value = ''; R('dcod').checked = false; }
    syncCod(); setErr('rdel', ''); updateTotals();
  };
  const syncCod = () => {
    const cod = R('mode').value !== 'shop' && R('dcod').checked;
    R('paid').disabled = cod;
    if (cod) { R('paid').value = ''; paidTouched = false; }
  };
  R('mode').addEventListener('change', syncMode);
  R('dcod').addEventListener('change', () => { syncCod(); updateTotals(); });
  R('dchg').addEventListener('input', () => { setErr('rdel', ''); updateTotals(); });
  ['dco', 'dph', 'dad'].forEach(k => R(k).addEventListener('input', () => setErr('rdel', '')));
  R('disc').addEventListener('input', () => { setErr('rdisc', ''); updateTotals(); });
  R('paid').addEventListener('input', () => { paidTouched = true; setErr('rpaid', ''); updateTotals(); });
  ACCT.fill(R('acct'));
  R('cust').addEventListener('input', () => { setErr('rpaid', ''); updateTotals(); });
  R('clear').addEventListener('click', async () => {
    if (!cart.length) return;
    if (!await ask('ဈေးခြင်းထဲက ကုန်ပစ္စည်းအားလုံးကို ရှင်းမလား?', 'ရှင်းမည်')) return;
    resetCart();
  });
  R('pay').addEventListener('click', checkout);
  R('bargo').addEventListener('click', () => R('cartbox').scrollIntoView({ behavior: 'smooth', block: 'start' }));

  loadStaff();
  R('seller').addEventListener('change', () => { try { localStorage.setItem('ssm.seller', R('seller').value); } catch (e) {} });
  renderProducts(); renderCart(); loadCusts();
}

function resetCart() {
  cart = []; paidTouched = false; R('disc').value = ''; R('cust').value = ''; loadCusts();
  R('mode').value = 'shop'; ['dco', 'dchg', 'dph', 'dad'].forEach(k => R(k).value = ''); R('dcod').checked = false;
  R('dbox').hidden = true; R('paid').disabled = false;
  ['rcart', 'rdisc', 'rpaid', 'rdel'].forEach(k => setErr(k, ''));
  renderCart();
}

/* ---------- Product picker ---------- */
function renderProducts() {
  const box = R('plist'), cnt = R('pcount');
  const all = S.products.filter(p => p.active);
  if (!all.length) {
    cnt.textContent = '';
    box.innerHTML = `<div class="empty"><div class="pimg">${svg('box', 34)}</div>
      <h3>ရောင်းရန် ကုန်ပစ္စည်း မရှိသေးပါ</h3><p>ကုန်ပစ္စည်းစာရင်းတွင် အရင်ထည့်ပါ။</p>
      <div class="row"><a class="btn primary" href="products.html?new=1" style="text-decoration:none">+ ကုန်ပစ္စည်းထည့်ရန်</a></div></div>`;
    return;
  }
  const q = norm(U.q.trim());
  const rows = all.filter(p => !q || [p.name, p.nameMm, p.code, p.barcode, p.brand].some(v => norm(v).includes(q)))
    .sort((a, b) => titleOf(a).localeCompare(titleOf(b), 'my'));
  const shown = rows.slice(0, 60);
  cnt.textContent = rows.length > shown.length
    ? `ကုန်ပစ္စည်း ${rows.length} မျိုးအနက် ${shown.length} မျိုး ပြထားသည် — ရှာဖွေ၍ ကျုံ့ပါ`
    : `ကုန်ပစ္စည်း ${rows.length} မျိုး`;
  box.innerHTML = rows.length
    ? `<div class="rt-products">${shown.map(p => {
        const out = !(p.stock > 0);
        return `<button type="button" class="rt-tile ${out ? 'out' : ''}" data-pick="${p.id}">
          ${thumb(p, 'sm')}
          <span class="tname">${esc(titleOf(p))}</span>
          <span class="tprice">${money(p.sellPrice)}</span>
          <span class="psub">${out ? 'ကုန်နေသည်' : (n(p.minStock) > 0 && p.stock <= p.minStock ? 'လက်ကျန်နည်း ' : 'လက်ကျန် ') + qty(p.stock) + ' ' + esc(unitName(p.unitId))}</span></button>`;
      }).join('')}</div>`
    : `<div class="empty"><h3>မတွေ့ပါ</h3><p>ရှာဖွေမှုနှင့် ကိုက်ညီသော ကုန်ပစ္စည်း မရှိပါ။</p></div>`;
}

// Enter in the search box (barcode scanner): exact code/barcode first, else first result
function pickFirst() {
  const raw = U.q.trim(), q = norm(raw); if (!q) return;
  const act = S.products.filter(p => p.active);
  const hit = act.find(p => norm(p.barcode) === q || norm(p.code) === q) ||
    act.filter(p => [p.name, p.nameMm, p.code, p.barcode, p.brand].some(v => norm(v).includes(q)))
       .sort((a, b) => titleOf(a).localeCompare(titleOf(b), 'my'))[0];
  if (!hit) return toast('မတွေ့ပါ');
  if (addToCart(hit.id)) { U.q = ''; R('q').value = ''; renderProducts(); }
}

function addToCart(id) {
  const p = find(id); if (!p) return false;
  if (!(p.stock > 0)) { toast('ကုန်နေပါပြီ'); return false; }
  if (p.expiryDate) {                                   // ရက်ကုန်ပြီးသော ပစ္စည်း ရောင်းမိခြင်းမှ သတိပေးရန်
    const [ey, em, ed] = String(p.expiryDate).split('-').map(Number), tn = new Date();
    const left = Math.round((new Date(ey, em - 1, ed) - new Date(tn.getFullYear(), tn.getMonth(), tn.getDate())) / 86400000);
    if (left < 0) toast(`⚠ ${p.nameMm || p.name} - ရက်ကုန်ပြီးသွားပါပြီ`);
  }
  const i = cart.findIndex(it => it.productId === id);
  if (i >= 0) {
    const next = round3(n(cart[i].qty) + 1);
    if (next > p.stock) { toast(`လက်ကျန် ${qty(p.stock)} ${unitName(p.unitId)} သာရှိသည်`); return false; }
    cart[i].qty = String(next);
  } else cart.push({ productId: id, qty: '1', price: String(p.sellPrice) });
  setErr('rcart', ''); renderCart();
  return true;
}

/* ---------- Cart + totals ---------- */
function renderCart() {
  cart = cart.filter(it => find(it.productId));
  const box = R('items');
  box.innerHTML = cart.length ? cart.map((it, i) => {
    const p = find(it.productId);
    return `<div class="irow" data-i="${i}">
      <div class="ihead">${thumb(p, 'sm')}
        <div class="iname"><div class="pname" style="font-size:16px">${esc(titleOf(p))}</div>
          <div class="psub">${esc(unitName(p.unitId))} · လက်ကျန် ${qty(p.stock)}</div></div>
        <button type="button" class="ibtn del" data-rm="${i}" aria-label="ဖယ်ရန်">${svg('trash', 20)}</button></div>
      <div class="igrid">
        <div class="field"><label>အရေအတွက်</label>
          <div class="qtyrow">
            <button type="button" class="btn" data-step="-1" data-i="${i}" aria-label="လျှော့ရန်">−</button>
            <input type="number" inputmode="decimal" min="0" step="any" data-f="qty" value="${esc(it.qty)}">
            <button type="button" class="btn" data-step="1" data-i="${i}" aria-label="တိုးရန်">+</button>
          </div></div>
        <div class="field"><label>ရောင်းစျေး (ကျပ်)</label>
          <input type="number" inputmode="numeric" min="0" step="1" data-f="price" value="${esc(it.price)}"></div>
        <div class="field"><label>ကျသင့်ငွေ</label><div class="ltotal" data-lt>${money(lineOf(it))}</div></div>
      </div>
      <div class="warnline" data-warn hidden></div></div>`;
  }).join('') : `<div class="hint" style="margin-top:8px">ဈေးခြင်း ဗလာဖြစ်နေသည်။ ကုန်ပစ္စည်းကို နှိပ်၍ ထည့်ပါ။</div>`;
  cart.forEach((_, i) => warnRow(i));
  updateTotals();
}

function warnRow(i) {
  const row = R('items').querySelector(`.irow[data-i="${i}"]`); if (!row) return;
  const it = cart[i], p = find(it.productId), over = n(it.qty) > (p.stock || 0);
  const w = row.querySelector('[data-warn]');
  w.hidden = !over;
  w.textContent = over ? `လက်ကျန် ${qty(p.stock)} ${unitName(p.unitId)} သာရှိသည်` : '';
}

function discOf() {
  const s = R('disc').value.trim();
  return s === '' ? 0 : parsePrice(s);
}

const modeOf = () => { const v = R('mode').value; return v.startsWith('co:') ? 'company' : v; };
const isDel = () => R('mode').value !== 'shop';
const isCod = () => isDel() && R('dcod').checked;
const dchgOf = () => { if (!isDel()) return 0; const s = R('dchg').value.trim(); return s === '' ? 0 : parsePrice(s); };

function updateTotals() {
  const sub = cart.reduce((a, it) => a + lineOf(it), 0);
  const disc = discOf() ?? 0, goods = Math.max(0, sub - disc);
  const dch = dchgOf() ?? 0, total = goods + dch, cod = isCod();
  if (!paidTouched && !cod) R('paid').value = cart.length ? total : '';
  const paid = cod ? 0 : (parsePrice(R('paid').value) ?? 0), change = cod ? 0 : paid - total;
  R('sub').textContent = money(sub);
  R('dline').hidden = !(isDel() && dch > 0); R('dval').textContent = money(dch);
  R('total').textContent = money(total);
  R('change').textContent = money(Math.max(0, change));
  R('barcount').textContent = cart.length;
  R('bartotal').textContent = money(total);
  const h = R('hint'); h.className = 'hint'; h.style.marginTop = '8px'; h.textContent = '';
  if (cod && cart.length) { h.textContent = `ပို့ပြီးမှ ${money(total)} ကောက်ရမည်`; }
  else if (cart.length && paid < total) {
    h.classList.add('warn');
    h.textContent = custOf(R('cust').value.trim())
      ? `အကြွေး ${money(total - paid)} ကျန်မည် (ဖောက်သည်အကြွေးအဖြစ် မှတ်မည်)`
      : `ရရှိငွေ ${money(total - paid)} လိုနေသည် — အကြွေးရောင်းလိုလျှင် ဖောက်သည် ရွေးပါ`;
  }
}

/* ---------- Checkout ---------- */
async function checkout() {
  const errs = {};
  if (!cart.length) errs.rcart = 'ဈေးခြင်းထဲ ကုန်ပစ္စည်း မရှိသေးပါ';
  else {
    for (const it of cart) {
      const p = find(it.productId), name = p ? titleOf(p) : '';
      if (!p) { errs.rcart = 'ကုန်ပစ္စည်း ရှာမတွေ့ပါ'; break; }
      if (!(Number(it.qty) > 0)) { errs.rcart = `"${name}" အရေအတွက်သည် 0 ထက် ကြီးရမည်`; break; }
      if (Number(it.qty) > (p.stock || 0)) { errs.rcart = `"${name}" လက်ကျန် ${qty(p.stock)} ${unitName(p.unitId)} သာရှိသည်`; break; }
      if (String(it.price).trim() === '' || !(Number(it.price) >= 0)) { errs.rcart = `"${name}" ရောင်းစျေး ထည့်ပါ`; break; }
    }
  }
  const subtotal = cart.reduce((a, it) => a + lineOf(it), 0);
  const disc = discOf();
  if (disc === null) errs.rdisc = 'လျှော့စျေး မှန်ကန်စွာ ထည့်ပါ';
  else if (disc > subtotal) errs.rdisc = 'လျှော့စျေးသည် ကုန်ပစ္စည်းတန်ဖိုးထက် မများရပါ';
  const goods = Math.max(0, subtotal - (disc || 0));
  const del = isDel(), cod = isCod(), mode = modeOf();
  const dch = dchgOf();
  if (del) {
    if (dch === null) errs.rdel = 'Delivery charge မှန်ကန်စွာ ထည့်ပါ';
    else if (mode === 'company' && !R('dco').value.trim()) errs.rdel = 'Delivery ကုမ္ပဏီအမည် ထည့်ပါ';
    else if (!R('dad').value.trim()) errs.rdel = 'ပို့ရမည့်လိပ်စာ ထည့်ပါ';
  }
  const total = goods + (del ? (dch || 0) : 0);
  const paid = cod ? 0 : parsePrice(R('paid').value);
  if (!cod) {
    if (paid === null) errs.rpaid = 'ရရှိငွေ ထည့်ပါ';
    else if (paid < total && !custOf(R('cust').value.trim())) errs.rpaid = 'ရရှိငွေ မလုံလောက်ပါ — အကြွေးရောင်းလိုလျှင် စာရင်းသွင်းထားသော ဖောက်သည် ရွေးပါ';
  }
  ['rcart', 'rdisc', 'rpaid', 'rdel'].forEach(k => setErr(k, errs[k]));
  const first = Object.keys(errs)[0];
  if (first) {
    const el = { rcart: R('items').querySelector('input'), rdisc: R('disc'), rpaid: R('paid'),
                 rdel: mode === 'company' && !R('dco').value.trim() ? R('dco') : (dch === null ? R('dchg') : R('dad')) }[first];
    if (first === 'rcart' && !cart.length) R('q').focus(); else if (el) el.focus();
    return;
  }

  const btn = R('pay'); btn.disabled = true;
  const seqBefore = S.saleSeq;
  try {
    const now = Date.now();
    const custName = R('cust').value.trim(), cu = custName ? custOf(custName) : null;
    const sale = {
      id: uid('s'), createdAt: now, no: nextNo(),
      items: cart.map(it => {
        const p = find(it.productId);
        return { productId: it.productId, name: titleOf(p), unit: unitName(p.unitId),
                 qty: Number(it.qty), price: Math.round(Number(it.price)), cost: p.costPrice || 0 };
      }),
      subtotal, discount: disc || 0, total: goods,
      deliveryCharge: del ? (dch || 0) : 0,
      paid, change: cod ? 0 : Math.max(0, paid - total),
      customerId: cu ? cu.id : null, customerName: cu ? cu.name : custName,
      acctId: R('acct').value || null,
      sellerId: R('seller').value || null,
      seller: R('seller').value ? R('seller').selectedOptions[0].textContent : '',
    };
    ACCT.remember(R('acct').value);
    if (!cod && paid < total) sale.credit = true;      // part/unpaid: balance is collected later from the customer
    if (del) {
      sale.delivery = {
        mode, courier: R('dco').value.trim(), address: R('dad').value.trim(), phone: R('dph').value.trim(),
        cod, status: 'pending', deliveredAt: null, settledAt: null, received: null, note: '', companyPaid: false,
      };
    }
    const changed = sale.items.map(it => {
      const p = find(it.productId);
      return { ...p, stock: round3((p.stock || 0) - it.qty), updatedAt: now };
    });
    await commit({ put: sale, products: changed });
    changed.forEach(np => { const i = S.products.findIndex(p => p.id === np.id); if (i >= 0) S.products[i] = np; });
    S.sales.push(sale);
    resetCart(); renderProducts();
    if (window.POSLowStock) window.POSLowStock.afterSale(changed);
    openView(sale, true);
    doPrint(sale, true);
  } catch (err) {
    S.saleSeq = seqBefore; console.error(err); toast('သိမ်း၍ မရပါ');
  } finally { btn.disabled = false; }
}

async function voidSale() {

  const now = Date.now();
  const changed = sale.items.map(it => {
    const p = find(it.productId);
    return p ? { ...p, stock: round3((p.stock || 0) + it.qty), updatedAt: now } : null;
  }).filter(Boolean);
  try { await commit({ del: sale.id, products: changed }); } catch (err) { console.error(err); return toast('ဖျက်၍ မရပါ'); }

<script>
/* ---------- Barcode scanner support ----------
   Bluetooth / USB scanners pair as a keyboard: they "type" the code very fast and press Enter.
   A burst of >= 4 characters, each < 70 ms apart, ending in Enter is treated as a scan. */
(() => {
  const DEF = { scanEnabled: true, scanBeep: true };
  const MIN_LEN = 4, GAP = 70;
  let cfg = { ...DEF }, handler = null, ctx = null;
  let buf = '', last = 0, t0 = 0, el0 = null, val0 = '';

  function loadCfg() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('pos-db', 5);
        r.onupgradeneeded = () => {
          ['products', 'categories', 'units', 'meta', 'purchases', 'sales', 'expenses', 'adjustments', 'customers', 'suppliers'].forEach(n => {
            if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' });
          });
        };
        r.onsuccess = () => {
          const db = r.result;
          try {
            const q = db.transaction('meta').objectStore('meta').get('settings');
            q.onsuccess = () => { cfg = { ...DEF, ...((q.result && q.result.value) || {}) }; db.close(); res(); };
            q.onerror = () => { db.close(); res(); };
          } catch (e) { db.close(); res(); }
        };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  }

  function beep(ok) {
    if (!cfg.scanBeep) return;
    try {
      const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
      ctx = ctx || new A(); if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = ok ? 1200 : 280; g.gain.value = 0.08;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + (ok ? 0.08 : 0.25));
    } catch (e) { /* no sound */ }
  }

  const editable = e => e && (e.tagName === 'INPUT' || e.tagName === 'TEXTAREA') && typeof e.value === 'string' &&
    !['checkbox', 'radio', 'button', 'file', 'submit'].includes(e.type);
  const reset = () => { buf = ''; last = 0; el0 = null; val0 = ''; };

  function onKey(e) {
    if (!handler || !cfg.scanEnabled) return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    const now = performance.now();
    if (e.key === 'Enter') {
      const isScan = buf.length >= MIN_LEN && now - last <= GAP * 2;
      if (!isScan) { reset(); return; }
      const code = buf, ms = Math.round(now - t0), a = el0, v = val0;
      reset();
      e.preventDefault(); e.stopImmediatePropagation();
      if (editable(a)) { a.value = v; a.dispatchEvent(new Event('input', { bubbles: true })); }   // undo the typed digits
      const res = handler(code, { len: code.length, ms });
      if (res !== false) beep(res !== 'miss');
      return;
    }
    if (!e.key || e.key.length !== 1) return;
    if (now - last > GAP) { buf = ''; t0 = now; el0 = document.activeElement; val0 = editable(el0) ? el0.value : ''; }
    buf += e.key; last = now;
  }
  document.addEventListener('keydown', onKey, true);

  window.POSScan = {
    start(fn) { handler = fn; return loadCfg(); },   // fn(code, {len, ms}) -> 'ok' | 'miss' | false (not handled)
    stop() { handler = null; reset(); },
    reload: loadCfg,
    beep,
  };
})();
</script>
<script>
/* ---------- Receipt printing ----------
   The receipt is drawn on a canvas (so Burmese text renders correctly), converted to ESC/POS
   raster data and handed to RawBT on Android via its intent link. Other devices get a PNG to save/share. */
(() => {
  const DEF = { paper: 58, shopName: '', shopAddr: '', shopPhone: '', footer: '', copies: 1, autoPrint: false };
  const FONT = '"Noto Sans Myanmar","Myanmar Text","Padauk","Pyidaungsu",sans-serif';
  const num = n => Math.round(Number(n) || 0).toLocaleString('en-US');
  const qty = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });
  const p2 = n => String(n).padStart(2, '0');
  const stamp = t => { const d = new Date(t); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };

  function loadCfg() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('pos-db', 5);
        r.onupgradeneeded = () => {
          ['products', 'categories', 'units', 'meta', 'purchases', 'sales', 'expenses', 'adjustments', 'customers', 'suppliers'].forEach(n => {
            if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' });
          });
        };
        r.onsuccess = () => {
          const db = r.result;
          try {
            const q = db.transaction('meta').objectStore('meta').get('settings');
            q.onsuccess = () => { db.close(); res({ ...DEF, ...((q.result && q.result.value) || {}) }); };
            q.onerror = () => { db.close(); res({ ...DEF }); };
          } catch (e) { db.close(); res({ ...DEF }); }
        };
        r.onerror = () => res({ ...DEF });
      } catch (e) { res({ ...DEF }); }
    });
  }

  /* ---- text wrapping (Burmese has no spaces: use word segmentation, then graphemes) ---- */
  const wordSeg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('my', { granularity: 'word' }) : null;
  const graphSeg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('my', { granularity: 'grapheme' }) : null;
  const pieces = t => wordSeg ? Array.from(wordSeg.segment(t), s => s.segment) : t.split(/(?<=\s)/);
  const graphemes = t => graphSeg ? Array.from(graphSeg.segment(t), s => s.segment) : Array.from(t);
  function wrap(ctx, text, maxW) {
    const lines = []; let cur = '';
    for (const p of pieces(String(text))) {
      if (ctx.measureText(cur + p).width <= maxW) { cur += p; continue; }
      if (cur.trim()) { lines.push(cur.trimEnd()); }
      cur = '';
      if (ctx.measureText(p).width <= maxW) { cur = p.replace(/^\s+/, ''); continue; }
      for (const g of graphemes(p)) {
        if (ctx.measureText(cur + g).width <= maxW) cur += g; else { lines.push(cur); cur = g; }
      }
    }
    if (cur.trim()) lines.push(cur.trimEnd());
    return lines.length ? lines : [''];
  }

  /* ---- receipt layout; draw=false only measures the height ---- */
  function paint(ctx, W, sale, cfg, draw) {
    const M = 6, inner = W - M * 2;
    let y = 6;
    const font = (size, bold) => { ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; };
    const lineH = size => Math.round(size * 1.55);
    const put = (t, x, base, align) => { ctx.textAlign = align; ctx.fillText(t, x, base); };
    const block = (t, size = 22, bold = false, align = 'left') => {
      if (!String(t || '').trim()) return;
      font(size, bold); const lh = lineH(size);
      for (const l of wrap(ctx, t, inner)) {
        if (draw) put(l, align === 'center' ? W / 2 : align === 'right' ? W - M : M, y + Math.round(lh * 0.74), align);
        y += lh;
      }
    };
    const row = (left, right, size = 22, bold = false) => {
      font(size, bold); const lh = lineH(size);
      const rw = Math.ceil(ctx.measureText(right).width);
      wrap(ctx, left, Math.max(60, inner - rw - 10)).forEach((l, i) => {
        if (draw) { const b = y + Math.round(lh * 0.74); put(l, M, b, 'left'); if (i === 0) put(right, W - M, b, 'right'); }
        y += lh;
      });
    };
    const sep = () => { y += 4; if (draw) for (let x = M; x < W - M; x += 10) ctx.fillRect(x, y, 6, 2); y += 10; };

    if (cfg.shopName) block(cfg.shopName, 30, true, 'center');
    block(cfg.shopAddr, 20, false, 'center');
    if (cfg.shopPhone) block('ဖုန်း: ' + cfg.shopPhone, 20, false, 'center');
    if (cfg.shopName || cfg.shopAddr || cfg.shopPhone) sep();
    row('ပြေစာအမှတ်', String(sale.no), 22);
    block(stamp(sale.createdAt), 22);
    if (sale.customerName) block('ဖောက်သည်: ' + sale.customerName, 22);
    if (sale.seller) block('ရောင်းသူ: ' + sale.seller, 22);
    if (sale.delivery) {
      block('ပို့ရန်: ' + (sale.delivery.address || ''), 22);
      if (sale.delivery.phone) block('ဖုန်း: ' + sale.delivery.phone, 22);
    }
    sep();
    for (const it of sale.items) {
      block(it.name, 24, true);
      row(`${qty(it.qty)} ${it.unit || ''} × ${num(it.price)}`, num(Math.round(it.qty * it.price)), 22);
    }
    sep();
    const dc = Number(sale.deliveryCharge) || 0, dv = sale.delivery;
    if (sale.discount > 0 || dc > 0) row('ကုန်ပစ္စည်းတန်ဖိုး', num(sale.subtotal));
    if (sale.discount > 0) row('လျှော့စျေး', '- ' + num(sale.discount));
    if (dc > 0) row('Delivery charge', num(dc));
    row('စုစုပေါင်း', num(sale.total + dc) + ' ကျပ်', 28, true);
    if (dv && dv.cod) row('ပို့ပြီးမှ ပေးရန်', num(sale.total + dc), 24, true);
    else if (sale.credit) { row('ရရှိငွေ', num(sale.paid)); row('အကြွေးကျန်', num(Math.max(0, sale.total + dc - sale.paid)), 24, true); }
    else { row('ရရှိငွေ', num(sale.paid)); row('ပြန်အမ်းငွေ', num(sale.change)); }
    if (String(cfg.footer || '').trim()) { sep(); block(cfg.footer, 22, false, 'center'); }
    return y + 28;
  }

  async function renderReceipt(sale, cfg) {
    try { await document.fonts.ready; } catch (e) { /* ignore */ }
    const W = Number(cfg.paper) === 80 ? 576 : 384;      // printable dots at 203 dpi
    const H = paint(document.createElement('canvas').getContext('2d'), W, sale, cfg, false);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
    paint(ctx, W, sale, cfg, true);
    return c;
  }

  /* ---- canvas -> ESC/POS raster (GS v 0), in bands of 240 rows ---- */
  function toEscpos(canvas, copies) {
    const w = canvas.width, h = canvas.height, wb = w >> 3;
    const px = canvas.getContext('2d').getImageData(0, 0, w, h).data;
    const BAND = 240, bands = Math.ceil(h / BAND);
    const one = 2 + bands * 8 + wb * h + 3;
    const out = new Uint8Array(one * copies);
    let o = 0;
    for (let c = 0; c < copies; c++) {
      out[o++] = 0x1b; out[o++] = 0x40;                    // ESC @  (initialise)
      for (let y0 = 0; y0 < h; y0 += BAND) {
        const bh = Math.min(BAND, h - y0);
        out.set([0x1d, 0x76, 0x30, 0x00, wb & 255, wb >> 8, bh & 255, bh >> 8], o); o += 8;
        for (let y = y0; y < y0 + bh; y++) for (let xb = 0; xb < wb; xb++) {
          let b = 0;
          for (let bit = 0; bit < 8; bit++) {
            const i = (y * w + xb * 8 + bit) * 4;
            if (px[i + 3] > 0 && (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) < 150) b |= 0x80 >> bit;
          }
          out[o++] = b;
        }
      }
      out[o++] = 0x1b; out[o++] = 0x64; out[o++] = 0x04;   // ESC d 4 (feed 4 lines)
    }
    return out;
  }

  function b64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  const rawbtUrl = bytes => 'intent:base64,' + b64(bytes) + '#Intent;scheme=RawBT;package=ru.a402d.RawBTprinter;end;';

  async function saveImage(canvas, name) {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], name + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  function sample() {
    const items = [
      { name: 'နမူနာ ကုန်ပစ္စည်း', unit: 'ခု', qty: 2, price: 1500 },
      { name: 'ကော်ဖီမစ် ၃ ခုတွဲ အထုပ်ကြီး', unit: 'ထုပ်', qty: 1, price: 4800 },
    ];
    const subtotal = items.reduce((a, it) => a + Math.round(it.qty * it.price), 0);
    return { no: 'TEST-0001', createdAt: Date.now(), items, subtotal, discount: 300, total: subtotal - 300, paid: 10000, change: 10000 - (subtotal - 300) };
  }

  window.POSPrint = {
    loadCfg, renderReceipt, sample,
    // -> 'rawbt' (sent to RawBT) | 'image' (PNG saved/shared) | 'skip' (auto-print is off)
    async printSale(sale, opt = {}) {
      const cfg = opt.cfg || await loadCfg();
      if (opt.auto && !cfg.autoPrint) return 'skip';
      const canvas = await renderReceipt(sale, cfg);
      if (/Android/i.test(navigator.userAgent)) {
        const copies = Math.min(5, Math.max(1, parseInt(cfg.copies, 10) || 1));
        window.location.href = rawbtUrl(toEscpos(canvas, copies));
        return 'rawbt';
      }
      await saveImage(canvas, 'receipt-' + sale.no);
      return 'image';
    },
    _toEscpos: toEscpos, _wrap: wrap,
  };
})();
</script>
<script>
/* Runs last on every page: opens the right page + highlights the menu */
(() => {
  const q = new URLSearchParams(location.search);
  let id = document.body.dataset.page || 'summary';
  let label = document.body.dataset.title || 'အနှစ်ချုပ်';
  if (q.get('p')) { id = q.get('p'); label = q.get('t') || label; }
  if (q.get('new')) id = id.split('/')[0] + '/new';
  const parent = id.split('/')[0];                       // open the submenu that holds the active item
  const sub = drawer.querySelector(`.sub[data-parent="${CSS.escape(parent)}"]`);
  if (sub) {
    sub.classList.add('open');
    const head = sub.previousElementSibling;
    if (head) { head.classList.add('open'); head.setAttribute('aria-expanded', 'true'); }
  }
  setActive(id, label);
})();
</script>
